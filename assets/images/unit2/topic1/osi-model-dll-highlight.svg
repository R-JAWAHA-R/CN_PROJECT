<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" width="800" height="550">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="l7" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#8B5CF6"/><stop offset="100%" stop-color="#7C3AED"/></linearGradient>
    <linearGradient id="l6" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#A78BFA"/><stop offset="100%" stop-color="#8B5CF6"/></linearGradient>
    <linearGradient id="l5" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#C4B5FD"/><stop offset="100%" stop-color="#A78BFA"/></linearGradient>
    <linearGradient id="l4" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#3B82F6"/><stop offset="100%" stop-color="#2563EB"/></linearGradient>
    <linearGradient id="l3" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#60A5FA"/><stop offset="100%" stop-color="#3B82F6"/></linearGradient>
    <linearGradient id="l2" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#10B981"/><stop offset="100%" stop-color="#059669"/></linearGradient>
    <linearGradient id="l1" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#F59E0B"/><stop offset="100%" stop-color="#D97706"/></linearGradient>
    <filter id="dllGlow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feFlood flood-color="#10B981" flood-opacity="0.6" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="550" fill="url(#bgGrad)" rx="12"/>

  <!-- Title -->
  <text x="400" y="38" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#1e293b">OSI Reference Model — Data Link Layer Highlighted</text>

  <!-- Layer Number Header -->
  <text x="95" y="72" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#64748b">Layer #</text>
  <text x="330" y="72" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#64748b">Layer Name</text>
  <text x="590" y="72" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#64748b">PDU</text>
  <text x="720" y="72" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#64748b">Group</text>

  <!-- Layer 7 - Application -->
  <rect x="150" y="82" width="360" height="52" rx="8" fill="url(#l7)" opacity="0.85"/>
  <text x="95" y="113" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#7C3AED">7</text>
  <text x="330" y="113" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" fill="white">Application Layer</text>
  <rect x="540" y="92" width="100" height="32" rx="6" fill="white" opacity="0.25"/>
  <text x="590" y="113" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="white">Data</text>
  <text x="720" y="108" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="500" fill="#7C3AED">Host</text>

  <!-- Layer 6 - Presentation -->
  <rect x="150" y="140" width="360" height="52" rx="8" fill="url(#l6)" opacity="0.85"/>
  <text x="95" y="171" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#8B5CF6">6</text>
  <text x="330" y="171" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" fill="white">Presentation Layer</text>
  <rect x="540" y="150" width="100" height="32" rx="6" fill="white" opacity="0.25"/>
  <text x="590" y="171" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="white">Data</text>
  <text x="720" y="166" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="500" fill="#8B5CF6">Layers</text>

  <!-- Layer 5 - Session -->
  <rect x="150" y="198" width="360" height="52" rx="8" fill="url(#l5)" opacity="0.85"/>
  <text x="95" y="229" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#A78BFA">5</text>
  <text x="330" y="229" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" fill="white">Session Layer</text>
  <rect x="540" y="208" width="100" height="32" rx="6" fill="white" opacity="0.25"/>
  <text x="590" y="229" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="white">Data</text>

  <!-- Layer 4 - Transport -->
  <rect x="150" y="256" width="360" height="52" rx="8" fill="url(#l4)" opacity="0.85"/>
  <text x="95" y="287" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#2563EB">4</text>
  <text x="330" y="287" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" fill="white">Transport Layer</text>
  <rect x="540" y="266" width="100" height="32" rx="6" fill="white" opacity="0.25"/>
  <text x="590" y="287" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="white">Segments</text>
  <text x="720" y="272" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="500" fill="#2563EB">Media</text>

  <!-- Layer 3 - Network -->
  <rect x="150" y="314" width="360" height="52" rx="8" fill="url(#l3)" opacity="0.85"/>
  <text x="95" y="345" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#3B82F6">3</text>
  <text x="330" y="345" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" fill="white">Network Layer</text>
  <rect x="540" y="324" width="100" height="32" rx="6" fill="white" opacity="0.25"/>
  <text x="590" y="345" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="white">Packets</text>
  <text x="720" y="340" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="500" fill="#3B82F6">Layers</text>

  <!-- Layer 2 - Data Link (HIGHLIGHTED) -->
  <rect x="144" y="369" width="372" height="58" rx="10" fill="none" stroke="#10B981" stroke-width="4" filter="url(#dllGlow)"/>
  <rect x="150" y="372" width="360" height="52" rx="8" fill="url(#l2)"/>
  <text x="95" y="403" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="800" fill="#059669">2</text>
  <text x="330" y="403" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="white">Data Link Layer</text>
  <rect x="540" y="382" width="100" height="32" rx="6" fill="#059669"/>
  <text x="590" y="403" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="white">Frames</text>
  <!-- Callout arrow -->
  <line x1="648" y1="398" x2="690" y2="398" stroke="#059669" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <defs>
    <marker id="arrowGreen" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6Z" fill="#059669"/>
    </marker>
  </defs>
  <rect x="692" y="385" width="90" height="26" rx="5" fill="#059669" opacity="0.15" stroke="#059669" stroke-width="1.5"/>
  <text x="737" y="403" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="#059669">★ Focus</text>

  <!-- Layer 1 - Physical -->
  <rect x="150" y="430" width="360" height="52" rx="8" fill="url(#l1)" opacity="0.85"/>
  <text x="95" y="461" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#D97706">1</text>
  <text x="330" y="461" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" fill="white">Physical Layer</text>
  <rect x="540" y="440" width="100" height="32" rx="6" fill="white" opacity="0.25"/>
  <text x="590" y="461" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="white">Bits</text>

  <!-- Bracket for Host Layers -->
  <path d="M760,85 Q775,85 775,170 Q775,200 760,200" fill="none" stroke="#8B5CF6" stroke-width="1.5" opacity="0.5"/>
  <!-- Bracket for Media Layers -->
  <path d="M760,330 Q775,330 775,400 Q775,470 760,470" fill="none" stroke="#2563EB" stroke-width="1.5" opacity="0.5"/>

  <!-- Bottom note -->
  <text x="400" y="520" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#94a3b8" font-style="italic">Layer 2 (Data Link Layer) is responsible for node-to-node data delivery via frames</text>
</svg>