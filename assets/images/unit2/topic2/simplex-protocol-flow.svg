<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <linearGradient id="senderG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="recvG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <marker id="arrowB" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3B82F6"/>
    </marker>
    <filter id="sh" x="-3%" y="-3%" width="106%" height="112%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.1"/>
    </filter>
  </defs>
  <rect width="800" height="480" fill="#F8FAFC" rx="8"/>
  <text x="400" y="30" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#1E293B">Simplest Protocol — Unidirectional Flow</text>
  <text x="400" y="50" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#64748B">No flow control • No error detection • No ACKs</text>

  <!-- Sender box -->
  <rect x="80" y="70" width="120" height="40" rx="8" fill="url(#senderG)" filter="url(#sh)"/>
  <text x="140" y="95" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#fff">Sender</text>

  <!-- Receiver box -->
  <rect x="580" y="70" width="120" height="40" rx="8" fill="url(#recvG)" filter="url(#sh)"/>
  <text x="640" y="95" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#fff">Receiver</text>

  <!-- Timelines -->
  <line x1="140" y1="110" x2="140" y2="430" stroke="#3B82F6" stroke-width="2.5" stroke-dasharray="6,3"/>
  <line x1="640" y1="110" x2="640" y2="430" stroke="#10B981" stroke-width="2.5" stroke-dasharray="6,3"/>

  <!-- Frame 0 -->
  <line x1="140" y1="140" x2="630" y2="175" stroke="#3B82F6" stroke-width="2" marker-end="url(#arrowB)"/>
  <rect x="330" y="142" width="100" height="26" rx="6" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1"/>
  <text x="380" y="160" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" fill="#1E40AF">Frame 0</text>
  <circle cx="140" cy="140" r="5" fill="#3B82F6"/>
  <circle cx="640" cy="175" r="5" fill="#10B981"/>

  <!-- Frame 1 -->
  <line x1="140" y1="200" x2="630" y2="235" stroke="#3B82F6" stroke-width="2" marker-end="url(#arrowB)"/>
  <rect x="330" y="202" width="100" height="26" rx="6" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1"/>
  <text x="380" y="220" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" fill="#1E40AF">Frame 1</text>
  <circle cx="140" cy="200" r="5" fill="#3B82F6"/>
  <circle cx="640" cy="235" r="5" fill="#10B981"/>

  <!-- Frame 2 -->
  <line x1="140" y1="260" x2="630" y2="295" stroke="#3B82F6" stroke-width="2" marker-end="url(#arrowB)"/>
  <rect x="330" y="262" width="100" height="26" rx="6" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1"/>
  <text x="380" y="280" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" fill="#1E40AF">Frame 2</text>
  <circle cx="140" cy="260" r="5" fill="#3B82F6"/>
  <circle cx="640" cy="295" r="5" fill="#10B981"/>

  <!-- Frame 3 -->
  <line x1="140" y1="320" x2="630" y2="355" stroke="#3B82F6" stroke-width="2" marker-end="url(#arrowB)"/>
  <rect x="330" y="322" width="100" height="26" rx="6" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1"/>
  <text x="380" y="340" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" fill="#1E40AF">Frame 3</text>
  <circle cx="140" cy="320" r="5" fill="#3B82F6"/>
  <circle cx="640" cy="355" r="5" fill="#10B981"/>

  <!-- Annotations: No waiting -->
  <text x="78" y="170" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#64748B">No wait</text>
  <text x="78" y="230" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#64748B">No wait</text>
  <text x="78" y="290" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#64748B">No wait</text>

  <!-- Receiver annotations -->
  <text x="700" y="178" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#059669">Accept</text>
  <text x="700" y="238" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#059669">Accept</text>
  <text x="700" y="298" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#059669">Accept</text>
  <text x="700" y="358" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#059669">Accept</text>

  <!-- Continuous dots -->
  <circle cx="140" cy="390" r="3" fill="#3B82F6"/>
  <circle cx="140" cy="405" r="3" fill="#3B82F6"/>
  <circle cx="140" cy="420" r="3" fill="#3B82F6"/>

  <!-- Bottom notes -->
  <rect x="160" y="440" width="480" height="30" rx="6" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
  <text x="400" y="460" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#1E40AF">Sender transmits continuously — receiver is assumed to be always ready</text>
</svg>