<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="sndG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="rcvG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <marker id="arrR" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3B82F6"/>
    </marker>
    <marker id="arrL" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="10 0, 0 3.5, 10 7" fill="#10B981"/>
    </marker>
    <filter id="sh" x="-3%" y="-3%" width="106%" height="112%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.1"/>
    </filter>
  </defs>
  <rect width="800" height="500" fill="#F8FAFC" rx="8"/>
  <text x="400" y="28" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#1E293B">Stop-and-Wait Protocol — Noiseless Channel</text>
  <text x="400" y="48" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#64748B">Flow control via ACK • No error handling • Sender waits for each ACK</text>

  <!-- Headers -->
  <rect x="80" y="62" width="120" height="36" rx="8" fill="url(#sndG)" filter="url(#sh)"/>
  <text x="140" y="85" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#fff">Sender</text>
  <rect x="580" y="62" width="120" height="36" rx="8" fill="url(#rcvG)" filter="url(#sh)"/>
  <text x="640" y="85" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#fff">Receiver</text>

  <!-- Timelines -->
  <line x1="140" y1="98" x2="140" y2="460" stroke="#3B82F6" stroke-width="2.5" stroke-dasharray="6,3"/>
  <line x1="640" y1="98" x2="640" y2="460" stroke="#10B981" stroke-width="2.5" stroke-dasharray="6,3"/>

  <!-- === Exchange 1: Frame 0 + ACK === -->
  <line x1="140" y1="120" x2="630" y2="150" stroke="#3B82F6" stroke-width="2" marker-end="url(#arrR)"/>
  <rect x="330" y="120" width="100" height="24" rx="6" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1"/>
  <text x="380" y="137" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" fill="#1E40AF">Frame 0</text>
  <circle cx="140" cy="120" r="4" fill="#3B82F6"/>
  <circle cx="640" cy="150" r="4" fill="#10B981"/>

  <!-- Wait bracket -->
  <line x1="125" y1="122" x2="125" y2="192" stroke="#F59E0B" stroke-width="1.5"/>
  <line x1="120" y1="122" x2="130" y2="122" stroke="#F59E0B" stroke-width="1.5"/>
  <line x1="120" y1="192" x2="130" y2="192" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="113" y="160" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="600" fill="#D97706">Wait</text>

  <!-- ACK 0 -->
  <line x1="640" y1="160" x2="150" y2="190" stroke="#10B981" stroke-width="2" marker-end="url(#arrL)"/>
  <rect x="340" y="162" width="80" height="24" rx="6" fill="#D1FAE5" stroke="#10B981" stroke-width="1"/>
  <text x="380" y="179" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" fill="#065F46">ACK</text>
  <circle cx="640" cy="160" r="4" fill="#10B981"/>
  <circle cx="140" cy="190" r="4" fill="#3B82F6"/>

  <!-- === Exchange 2: Frame 1 + ACK === -->
  <line x1="140" y1="215" x2="630" y2="245" stroke="#3B82F6" stroke-width="2" marker-end="url(#arrR)"/>
  <rect x="330" y="215" width="100" height="24" rx="6" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1"/>
  <text x="380" y="232" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" fill="#1E40AF">Frame 1</text>
  <circle cx="140" cy="215" r="4" fill="#3B82F6"/>
  <circle cx="640" cy="245" r="4" fill="#10B981"/>

  <!-- Wait bracket 2 -->
  <line x1="125" y1="217" x2="125" y2="287" stroke="#F59E0B" stroke-width="1.5"/>
  <line x1="120" y1="217" x2="130" y2="217" stroke="#F59E0B" stroke-width="1.5"/>
  <line x1="120" y1="287" x2="130" y2="287" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="113" y="255" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="600" fill="#D97706">Wait</text>

  <!-- ACK 1 -->
  <line x1="640" y1="255" x2="150" y2="285" stroke="#10B981" stroke-width="2" marker-end="url(#arrL)"/>
  <rect x="340" y="257" width="80" height="24" rx="6" fill="#D1FAE5" stroke="#10B981" stroke-width="1"/>
  <text x="380" y="274" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" fill="#065F46">ACK</text>
  <circle cx="640" cy="255" r="4" fill="#10B981"/>
  <circle cx="140" cy="285" r="4" fill="#3B82F6"/>

  <!-- === Exchange 3: Frame 2 + ACK === -->
  <line x1="140" y1="310" x2="630" y2="340" stroke="#3B82F6" stroke-width="2" marker-end="url(#arrR)"/>
  <rect x="330" y="310" width="100" height="24" rx="6" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1"/>
  <text x="380" y="327" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" fill="#1E40AF">Frame 2</text>
  <circle cx="140" cy="310" r="4" fill="#3B82F6"/>
  <circle cx="640" cy="340" r="4" fill="#10B981"/>

  <!-- Wait bracket 3 -->
  <line x1="125" y1="312" x2="125" y2="382" stroke="#F59E0B" stroke-width="1.5"/>
  <line x1="120" y1="312" x2="130" y2="312" stroke="#F59E0B" stroke-width="1.5"/>
  <line x1="120" y1="382" x2="130" y2="382" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="113" y="350" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="600" fill="#D97706">Wait</text>

  <!-- ACK 2 -->
  <line x1="640" y1="350" x2="150" y2="380" stroke="#10B981" stroke-width="2" marker-end="url(#arrL)"/>
  <rect x="340" y="352" width="80" height="24" rx="6" fill="#D1FAE5" stroke="#10B981" stroke-width="1"/>
  <text x="380" y="369" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" fill="#065F46">ACK</text>
  <circle cx="640" cy="350" r="4" fill="#10B981"/>
  <circle cx="140" cy="380" r="4" fill="#3B82F6"/>

  <!-- Dots -->
  <circle cx="140" cy="410" r="3" fill="#3B82F6"/>
  <circle cx="140" cy="425" r="3" fill="#3B82F6"/>
  <circle cx="140" cy="440" r="3" fill="#3B82F6"/>
  <circle cx="640" cy="410" r="3" fill="#10B981"/>
  <circle cx="640" cy="425" r="3" fill="#10B981"/>
  <circle cx="640" cy="440" r="3" fill="#10B981"/>

  <!-- Legend -->
  <rect x="200" y="460" width="400" height="30" rx="6" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
  <text x="400" y="480" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#1E40AF">Sender waits for ACK before sending the next frame — flow control only</text>
</svg>