<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="rootGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="catGrad1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="catGrad2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#DC2626"/>
    </linearGradient>
    <linearGradient id="leafGrad1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6EE7B7"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <linearGradient id="leafGrad2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FCA5A5"/>
      <stop offset="100%" stop-color="#F87171"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="800" height="500" fill="#F8FAFC" rx="8"/>
  <text x="400" y="32" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#1E293B">Data Link Layer Protocols — Taxonomy</text>

  <!-- Root node -->
  <rect x="250" y="52" width="300" height="48" rx="10" fill="url(#rootGrad)" filter="url(#shadow)"/>
  <text x="400" y="82" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#fff">Data Link Layer Protocols</text>

  <!-- Vertical line from root -->
  <line x1="400" y1="100" x2="400" y2="130" stroke="#94A3B8" stroke-width="2"/>
  <!-- Horizontal split -->
  <line x1="200" y1="130" x2="600" y2="130" stroke="#94A3B8" stroke-width="2"/>
  <!-- Down to categories -->
  <line x1="200" y1="130" x2="200" y2="160" stroke="#94A3B8" stroke-width="2"/>
  <line x1="600" y1="130" x2="600" y2="160" stroke="#94A3B8" stroke-width="2"/>

  <!-- Noiseless category -->
  <rect x="70" y="160" width="260" height="48" rx="10" fill="url(#catGrad1)" filter="url(#shadow)"/>
  <text x="200" y="183" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#fff">Noiseless Channel</text>
  <text x="200" y="199" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#D1FAE5">No errors assumed</text>

  <!-- Noisy category -->
  <rect x="470" y="160" width="260" height="48" rx="10" fill="url(#catGrad2)" filter="url(#shadow)"/>
  <text x="600" y="183" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#fff">Noisy Channel</text>
  <text x="600" y="199" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#FEE2E2">Errors possible</text>

  <!-- Lines from Noiseless -->
  <line x1="200" y1="208" x2="200" y2="238" stroke="#059669" stroke-width="2"/>
  <line x1="120" y1="238" x2="280" y2="238" stroke="#059669" stroke-width="2"/>
  <line x1="120" y1="238" x2="120" y2="268" stroke="#059669" stroke-width="2"/>
  <line x1="280" y1="238" x2="280" y2="268" stroke="#059669" stroke-width="2"/>

  <!-- Lines from Noisy -->
  <line x1="600" y1="208" x2="600" y2="238" stroke="#DC2626" stroke-width="2"/>
  <line x1="470" y1="238" x2="730" y2="238" stroke="#DC2626" stroke-width="2"/>
  <line x1="470" y1="238" x2="470" y2="268" stroke="#DC2626" stroke-width="2"/>
  <line x1="600" y1="238" x2="600" y2="268" stroke="#DC2626" stroke-width="2"/>
  <line x1="730" y1="238" x2="730" y2="268" stroke="#DC2626" stroke-width="2"/>

  <!-- Noiseless leaf 1: Simplest Protocol -->
  <rect x="30" y="268" width="180" height="70" rx="10" fill="url(#leafGrad1)" filter="url(#shadow)"/>
  <text x="120" y="296" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#064E3B">Simplest Protocol</text>
  <text x="120" y="314" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#065F46">No flow control</text>
  <text x="120" y="328" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#065F46">No ACK needed</text>

  <!-- Noiseless leaf 2: Stop-and-Wait -->
  <rect x="220" y="268" width="180" height="70" rx="10" fill="url(#leafGrad1)" filter="url(#shadow)"/>
  <text x="310" y="296" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#064E3B">Stop-and-Wait</text>
  <text x="310" y="314" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#065F46">Flow control via ACK</text>
  <text x="310" y="328" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#065F46">No error handling</text>

  <!-- Noisy leaf 1: Stop-and-Wait ARQ -->
  <rect x="390" y="268" width="160" height="70" rx="10" fill="url(#leafGrad2)" filter="url(#shadow)"/>
  <text x="470" y="290" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" fill="#7F1D1D">Stop-and-Wait</text>
  <text x="470" y="306" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" fill="#7F1D1D">ARQ</text>
  <text x="470" y="324" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#991B1B">Timer + retransmit</text>

  <!-- Noisy leaf 2: Go-Back-N ARQ -->
  <rect x="560" y="268" width="160" height="70" rx="10" fill="url(#leafGrad2)" filter="url(#shadow)"/>
  <text x="640" y="290" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" fill="#7F1D1D">Go-Back-N</text>
  <text x="640" y="306" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" fill="#7F1D1D">ARQ</text>
  <text x="640" y="324" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#991B1B">Sliding window</text>

  <!-- Noisy leaf 3: Selective Repeat ARQ (moved down) -->
  <line x1="730" y1="338" x2="730" y2="370" stroke="#DC2626" stroke-width="2"/>
  <rect x="640" y="370" width="160" height="70" rx="10" fill="url(#leafGrad2)" filter="url(#shadow)"/>
  <text x="720" y="392" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" fill="#7F1D1D">Selective Repeat</text>
  <text x="720" y="408" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" fill="#7F1D1D">ARQ</text>
  <text x="720" y="426" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#991B1B">Selective retransmit</text>

  <!-- Legend -->
  <rect x="30" y="450" width="14" height="14" rx="3" fill="#10B981"/>
  <text x="50" y="462" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#475569">Noiseless Channel Protocols</text>
  <rect x="230" y="450" width="14" height="14" rx="3" fill="#EF4444"/>
  <text x="250" y="462" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#475569">Noisy Channel Protocols (ARQ)</text>
  <text x="780" y="492" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#94A3B8">ARQ = Automatic Repeat reQuest</text>
</svg>