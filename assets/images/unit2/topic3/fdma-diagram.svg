<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <filter id="fs">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.1"/>
    </filter>
  </defs>
  
  <rect width="800" height="500" fill="#FAFBFF" rx="8"/>
  
  <!-- Title -->
  <text x="400" y="34" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#1E293B">FDMA — Frequency Division Multiple Access</text>
  <line x1="190" y1="44" x2="610" y2="44" stroke="#3B82F6" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Subtitle -->
  <text x="400" y="62" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#64748B">Each user is assigned a dedicated frequency band for the entire duration</text>
  
  <!-- Y-axis -->
  <line x1="120" y1="90" x2="120" y2="385" stroke="#334155" stroke-width="2"/>
  <polygon points="120,85 115,95 125,95" fill="#334155"/>
  <text x="55" y="240" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#334155" transform="rotate(-90 55 240)">Frequency →</text>
  
  <!-- X-axis -->
  <line x1="120" y1="385" x2="660" y2="385" stroke="#334155" stroke-width="2"/>
  <polygon points="665,385 655,380 655,390" fill="#334155"/>
  <text x="390" y="415" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#334155">Time →</text>
  
  <!-- Guard bands (thin gray lines between channels) -->
  <rect x="121" y="100" width="530" height="5" rx="1" fill="#E2E8F0"/>
  <rect x="121" y="159" width="530" height="5" rx="1" fill="#E2E8F0"/>
  <rect x="121" y="218" width="530" height="5" rx="1" fill="#E2E8F0"/>
  <rect x="121" y="277" width="530" height="5" rx="1" fill="#E2E8F0"/>
  <rect x="121" y="336" width="530" height="5" rx="1" fill="#E2E8F0"/>
  
  <!-- User 1 (Blue) - Band f1 -->
  <rect x="121" y="105" width="530" height="54" rx="4" fill="#3B82F6" opacity="0.8"/>
  <text x="386" y="137" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="white">User 1 — Frequency Band f₁</text>
  
  <!-- User 2 (Purple) - Band f2 -->
  <rect x="121" y="164" width="530" height="54" rx="4" fill="#8B5CF6" opacity="0.8"/>
  <text x="386" y="196" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="white">User 2 — Frequency Band f₂</text>
  
  <!-- User 3 (Green) - Band f3 -->
  <rect x="121" y="223" width="530" height="54" rx="4" fill="#10B981" opacity="0.8"/>
  <text x="386" y="255" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="white">User 3 — Frequency Band f₃</text>
  
  <!-- User 4 (Amber) - Band f4 -->
  <rect x="121" y="282" width="530" height="54" rx="4" fill="#F59E0B" opacity="0.8"/>
  <text x="386" y="314" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="white">User 4 — Frequency Band f₄</text>
  
  <!-- Frequency labels on Y-axis -->
  <text x="112" y="135" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#64748B">f₁</text>
  <text x="112" y="194" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#64748B">f₂</text>
  <text x="112" y="253" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#64748B">f₃</text>
  <text x="112" y="312" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#64748B">f₄</text>
  
  <!-- Guard band labels -->
  <text x="668" y="107" font-family="Segoe UI, Arial, sans-serif" font-size="8" fill="#94A3B8">Guard Band</text>
  <text x="668" y="166" font-family="Segoe UI, Arial, sans-serif" font-size="8" fill="#94A3B8">Guard Band</text>
  <text x="668" y="225" font-family="Segoe UI, Arial, sans-serif" font-size="8" fill="#94A3B8">Guard Band</text>
  <text x="668" y="284" font-family="Segoe UI, Arial, sans-serif" font-size="8" fill="#94A3B8">Guard Band</text>
  <text x="668" y="343" font-family="Segoe UI, Arial, sans-serif" font-size="8" fill="#94A3B8">Guard Band</text>
  
  <!-- Bracket showing "Total Bandwidth" -->
  <line x1="660" y1="100" x2="670" y2="100" stroke="#1E293B" stroke-width="1.5"/>
  <line x1="670" y1="100" x2="670" y2="340" stroke="#1E293B" stroke-width="1.5"/>
  <line x1="660" y1="340" x2="670" y2="340" stroke="#1E293B" stroke-width="1.5"/>
  <text x="695" y="215" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="600" fill="#1E293B" transform="rotate(90 695 215)">Total Bandwidth</text>
  
  <!-- Time markers on X-axis -->
  <text x="130" y="400" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#64748B">t₀</text>
  <text x="390" y="400" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#64748B">Continuous</text>
  <text x="640" y="400" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#64748B">t∞</text>

  <!-- Key characteristics -->
  <rect x="120" y="430" width="540" height="60" rx="12" fill="white" stroke="#BFDBFE" stroke-width="1.5" filter="url(#fs)"/>
  <text x="140" y="452" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#1E40AF">Key Characteristics:</text>
  <text x="140" y="472" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#334155">✦ No collisions (dedicated bands)   ✦ Guard bands prevent interference   ✦ Wastes bandwidth if user is idle</text>
  <text x="140" y="486" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#64748B">Example: FM Radio, Cable TV, early cellular systems (AMPS)</text>
</svg>