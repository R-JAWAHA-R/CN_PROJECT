<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="rootGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="cat1Grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#DC2626"/>
    </linearGradient>
    <linearGradient id="cat2Grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="cat3Grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="800" height="520" fill="#F8FAFC" rx="8"/>
  <text x="400" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#1E293B">Multiple Access Protocols — Taxonomy</text>

  <!-- Root -->
  <rect x="260" y="48" width="280" height="44" rx="22" fill="url(#rootGrad)" filter="url(#shadow)"/>
  <text x="400" y="76" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">Multiple Access Protocols</text>

  <!-- Lines from root to categories -->
  <line x1="310" y1="92" x2="140" y2="140" stroke="#94A3B8" stroke-width="2"/>
  <line x1="400" y1="92" x2="400" y2="140" stroke="#94A3B8" stroke-width="2"/>
  <line x1="490" y1="92" x2="660" y2="140" stroke="#94A3B8" stroke-width="2"/>

  <!-- Category 1: Random Access -->
  <rect x="40" y="140" width="200" height="40" rx="20" fill="url(#cat1Grad)" filter="url(#shadow)"/>
  <text x="140" y="165" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">Random Access</text>

  <!-- Category 2: Controlled Access -->
  <rect x="300" y="140" width="200" height="40" rx="20" fill="url(#cat2Grad)" filter="url(#shadow)"/>
  <text x="400" y="165" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">Controlled Access</text>

  <!-- Category 3: Channelization -->
  <rect x="560" y="140" width="200" height="40" rx="20" fill="url(#cat3Grad)" filter="url(#shadow)"/>
  <text x="660" y="165" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">Channelization</text>

  <!-- Random Access children lines -->
  <line x1="80" y1="180" x2="80" y2="220" stroke="#FCA5A5" stroke-width="2"/>
  <line x1="140" y1="180" x2="140" y2="220" stroke="#FCA5A5" stroke-width="2"/>
  <line x1="200" y1="180" x2="200" y2="220" stroke="#FCA5A5" stroke-width="2"/>
  <line x1="140" y1="180" x2="80" y2="220" stroke="#FCA5A5" stroke-width="1.5"/>
  <line x1="140" y1="180" x2="200" y2="220" stroke="#FCA5A5" stroke-width="1.5"/>

  <!-- Random Access children -->
  <rect x="30" y="220" width="100" height="34" rx="8" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="80" y="242" text-anchor="middle" font-size="12" font-weight="600" fill="#DC2626">ALOHA</text>

  <rect x="90" y="270" width="100" height="34" rx="8" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="140" y="292" text-anchor="middle" font-size="12" font-weight="600" fill="#DC2626">CSMA</text>

  <rect x="150" y="220" width="100" height="34" rx="8" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="200" y="242" text-anchor="middle" font-size="12" font-weight="600" fill="#DC2626">CSMA/CD</text>

  <!-- Lines to ALOHA sub -->
  <line x1="80" y1="254" x2="48" y2="320" stroke="#FBBF24" stroke-width="1.5"/>
  <line x1="80" y1="254" x2="128" y2="320" stroke="#FBBF24" stroke-width="1.5"/>

  <!-- ALOHA sub-items -->
  <rect x="5" y="320" width="90" height="30" rx="6" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.2"/>
  <text x="50" y="340" text-anchor="middle" font-size="10" font-weight="600" fill="#B45309">Pure ALOHA</text>

  <rect x="100" y="320" width="100" height="30" rx="6" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.2"/>
  <text x="150" y="340" text-anchor="middle" font-size="10" font-weight="600" fill="#B45309">Slotted ALOHA</text>

  <!-- CSMA sub lines -->
  <line x1="140" y1="304" x2="80" y2="370" stroke="#FBBF24" stroke-width="1.5"/>
  <line x1="140" y1="304" x2="160" y2="370" stroke="#FBBF24" stroke-width="1.5"/>
  <line x1="140" y1="304" x2="240" y2="370" stroke="#FBBF24" stroke-width="1.5"/>

  <!-- CSMA sub-items -->
  <rect x="30" y="370" width="100" height="30" rx="6" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.2"/>
  <text x="80" y="390" text-anchor="middle" font-size="9.5" font-weight="600" fill="#B45309">1-Persistent</text>

  <rect x="110" y="410" width="100" height="30" rx="6" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.2"/>
  <text x="160" y="430" text-anchor="middle" font-size="9.5" font-weight="600" fill="#B45309">Non-Persistent</text>

  <rect x="195" y="370" width="100" height="30" rx="6" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.2"/>
  <text x="245" y="390" text-anchor="middle" font-size="9.5" font-weight="600" fill="#B45309">p-Persistent</text>

  <!-- CSMA/CD  -->
  <line x1="200" y1="254" x2="200" y2="455" stroke="#FCA5A5" stroke-width="1.2" stroke-dasharray="4,3"/>
  <rect x="140" y="455" width="120" height="30" rx="6" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.2"/>
  <text x="200" y="474" text-anchor="middle" font-size="9.5" font-weight="600" fill="#DC2626">CSMA/CA (Wi-Fi)</text>

  <!-- Controlled Access children lines -->
  <line x1="340" y1="180" x2="340" y2="220" stroke="#6EE7B7" stroke-width="2"/>
  <line x1="400" y1="180" x2="400" y2="220" stroke="#6EE7B7" stroke-width="2"/>
  <line x1="460" y1="180" x2="460" y2="220" stroke="#6EE7B7" stroke-width="2"/>

  <!-- Controlled Access children -->
  <rect x="290" y="220" width="100" height="34" rx="8" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="340" y="242" text-anchor="middle" font-size="11" font-weight="600" fill="#059669">Reservation</text>

  <rect x="350" y="270" width="100" height="34" rx="8" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="400" y="292" text-anchor="middle" font-size="11" font-weight="600" fill="#059669">Polling</text>

  <rect x="410" y="220" width="110" height="34" rx="8" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="465" y="242" text-anchor="middle" font-size="11" font-weight="600" fill="#059669">Token Passing</text>

  <line x1="400" y1="180" x2="340" y2="220" stroke="#6EE7B7" stroke-width="1.5"/>
  <line x1="400" y1="180" x2="400" y2="270" stroke="#6EE7B7" stroke-width="1.5"/>
  <line x1="400" y1="180" x2="465" y2="220" stroke="#6EE7B7" stroke-width="1.5"/>

  <!-- Channelization children lines -->
  <line x1="600" y1="180" x2="600" y2="220" stroke="#C4B5FD" stroke-width="2"/>
  <line x1="660" y1="180" x2="660" y2="220" stroke="#C4B5FD" stroke-width="2"/>
  <line x1="720" y1="180" x2="720" y2="220" stroke="#C4B5FD" stroke-width="2"/>

  <line x1="660" y1="180" x2="600" y2="220" stroke="#C4B5FD" stroke-width="1.5"/>
  <line x1="660" y1="180" x2="720" y2="220" stroke="#C4B5FD" stroke-width="1.5"/>

  <!-- Channelization children -->
  <rect x="555" y="220" width="90" height="34" rx="8" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="600" y="242" text-anchor="middle" font-size="12" font-weight="600" fill="#7C3AED">FDMA</text>

  <rect x="615" y="270" width="90" height="34" rx="8" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="660" y="292" text-anchor="middle" font-size="12" font-weight="600" fill="#7C3AED">TDMA</text>

  <rect x="675" y="220" width="90" height="34" rx="8" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="720" y="242" text-anchor="middle" font-size="12" font-weight="600" fill="#7C3AED">CDMA</text>

  <!-- Descriptions -->
  <rect x="540" y="330" width="230" height="70" rx="8" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="1"/>
  <text x="655" y="349" text-anchor="middle" font-size="10" fill="#6D28D9" font-weight="600">Channelization</text>
  <text x="655" y="364" text-anchor="middle" font-size="9" fill="#7C3AED">Divide channel by frequency,</text>
  <text x="655" y="378" text-anchor="middle" font-size="9" fill="#7C3AED">time, or code — no collisions</text>
  <text x="655" y="392" text-anchor="middle" font-size="9" fill="#7C3AED">Fixed allocation of bandwidth</text>

  <rect x="310" y="330" width="200" height="70" rx="8" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1"/>
  <text x="410" y="349" text-anchor="middle" font-size="10" fill="#047857" font-weight="600">Controlled Access</text>
  <text x="410" y="364" text-anchor="middle" font-size="9" fill="#059669">Stations take turns via</text>
  <text x="410" y="378" text-anchor="middle" font-size="9" fill="#059669">central control or token</text>
  <text x="410" y="392" text-anchor="middle" font-size="9" fill="#059669">No collisions, ordered access</text>

  <!-- Footer -->
  <text x="400" y="506" text-anchor="middle" font-size="10" fill="#94A3B8" font-style="italic">Multiple Access Protocols allow multiple stations to share a single broadcast link</text>
</svg>