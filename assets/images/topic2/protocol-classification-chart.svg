<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="greenHead" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="redHead" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>
    <filter id="sh" x="-3%" y="-3%" width="106%" height="112%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="800" height="500" fill="#F8FAFC" rx="8"/>
  <text x="400" y="34" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#1E293B">Protocol Classification: Noiseless vs Noisy Channel</text>

  <!-- Divider -->
  <line x1="400" y1="50" x2="400" y2="490" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="400" y="488" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#94A3B8">VS</text>

  <!-- LEFT: Noiseless -->
  <rect x="30" y="54" width="340" height="42" rx="8" fill="url(#greenHead)" filter="url(#sh)"/>
  <text x="200" y="80" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#fff">Noiseless Channel</text>

  <!-- Characteristics box -->
  <rect x="30" y="108" width="340" height="160" rx="8" fill="#fff" stroke="#10B981" stroke-width="1.5" filter="url(#sh)"/>
  <text x="200" y="132" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#065F46">Key Characteristics</text>
  <line x1="50" y1="142" x2="350" y2="142" stroke="#D1FAE5" stroke-width="1"/>
  <circle cx="58" cy="164" r="4" fill="#10B981"/><text x="72" y="168" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#334155">Ideal channel — no frame loss</text>
  <circle cx="58" cy="188" r="4" fill="#10B981"/><text x="72" y="192" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#334155">No bit errors during transmission</text>
  <circle cx="58" cy="212" r="4" fill="#10B981"/><text x="72" y="216" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#334155">No retransmission mechanism</text>
  <circle cx="58" cy="236" r="4" fill="#10B981"/><text x="72" y="240" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#334155">Simpler design, theoretical model</text>

  <!-- Protocols list -->
  <rect x="30" y="280" width="340" height="90" rx="8" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1" filter="url(#sh)"/>
  <text x="200" y="304" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#065F46">Protocols</text>
  <rect x="55" y="316" width="130" height="28" rx="6" fill="#10B981"/>
  <text x="120" y="335" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" fill="#fff">Simplest Protocol</text>
  <rect x="200" y="316" width="145" height="28" rx="6" fill="#059669"/>
  <text x="272" y="335" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" fill="#fff">Stop-and-Wait</text>

  <!-- Flow control note -->
  <rect x="30" y="382" width="340" height="52" rx="8" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1"/>
  <text x="50" y="402" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#166534">✓ Flow control in Stop-and-Wait only</text>
  <text x="50" y="420" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#166534">✓ No sequence numbers needed</text>

  <!-- RIGHT: Noisy -->
  <rect x="430" y="54" width="340" height="42" rx="8" fill="url(#redHead)" filter="url(#sh)"/>
  <text x="600" y="80" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#fff">Noisy Channel</text>

  <!-- Characteristics box -->
  <rect x="430" y="108" width="340" height="160" rx="8" fill="#fff" stroke="#EF4444" stroke-width="1.5" filter="url(#sh)"/>
  <text x="600" y="132" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#991B1B">Key Characteristics</text>
  <line x1="450" y1="142" x2="750" y2="142" stroke="#FEE2E2" stroke-width="1"/>
  <circle cx="458" cy="164" r="4" fill="#EF4444"/><text x="472" y="168" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#334155">Frames can be lost or corrupted</text>
  <circle cx="458" cy="188" r="4" fill="#EF4444"/><text x="472" y="192" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#334155">Bit errors may occur in transit</text>
  <circle cx="458" cy="212" r="4" fill="#EF4444"/><text x="472" y="216" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#334155">ARQ retransmission required</text>
  <circle cx="458" cy="236" r="4" fill="#EF4444"/><text x="472" y="240" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#334155">Timers, sequence numbers needed</text>

  <!-- Protocols list -->
  <rect x="430" y="280" width="340" height="90" rx="8" fill="#FEF2F2" stroke="#FECACA" stroke-width="1" filter="url(#sh)"/>
  <text x="600" y="304" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#991B1B">Protocols (ARQ)</text>
  <rect x="440" y="316" width="100" height="28" rx="6" fill="#EF4444"/>
  <text x="490" y="335" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="600" fill="#fff">S&amp;W ARQ</text>
  <rect x="548" y="316" width="100" height="28" rx="6" fill="#DC2626"/>
  <text x="598" y="335" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="600" fill="#fff">Go-Back-N</text>
  <rect x="656" y="316" width="106" height="28" rx="6" fill="#B91C1C"/>
  <text x="709" y="335" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="600" fill="#fff">Selective Repeat</text>

  <!-- Error handling note -->
  <rect x="430" y="382" width="340" height="52" rx="8" fill="#FEF2F2" stroke="#FECACA" stroke-width="1"/>
  <text x="450" y="402" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#991B1B">⚠ Error detection + retransmission</text>
  <text x="450" y="420" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#991B1B">⚠ Sequence numbers prevent duplicates</text>

  <!-- Bottom legend -->
  <text x="400" y="465" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" fill="#64748B">Complexity increases: Noiseless → Noisy (with ARQ mechanisms)</text>
  <rect x="180" y="474" width="440" height="4" rx="2" fill="#E2E8F0"/>
  <rect x="180" y="474" width="220" height="4" rx="2" fill="#10B981"/>
  <rect x="400" y="474" width="220" height="4" rx="2" fill="#EF4444"/>
</svg>