<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="jabak-bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="jabak-j-grad" x1="16" y1="12" x2="48" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="jabak-accent" x1="20" y1="10" x2="50" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded Squircle Base -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#jabak-bg)"/>
  <rect x="2" y="2" width="60" height="60" rx="16" stroke="rgba(255,255,255,0.25)" stroke-width="1.5"/>

  <!-- Network Circuit Lines in Background -->
  <path d="M12 20 L24 20 L30 14" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="12" cy="20" r="1.5" fill="#ffffff" opacity="0.6"/>
  <circle cx="30" cy="14" r="1.5" fill="#ffffff" opacity="0.6"/>

  <path d="M52 44 L40 44 L34 50" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="52" cy="44" r="1.5" fill="#ffffff" opacity="0.6"/>
  <circle cx="34" cy="50" r="1.5" fill="#ffffff" opacity="0.6"/>

  <!-- Stylized Geometric 'J' & Interconnected Mesh -->
  <!-- Top Bar / Routing node -->
  <path d="M22 18 L46 18" stroke="url(#jabak-j-grad)" stroke-width="5" stroke-linecap="round" filter="url(#glow)"/>
  
  <!-- Vertical Stem down to curved hook -->
  <path d="M40 18 L40 38 C40 45 35 49 28 49 C21 49 17 44 17 38" 
        stroke="url(#jabak-j-grad)" stroke-width="5" stroke-linecap="round" fill="none" filter="url(#glow)"/>

  <!-- Network Nodes / Packets on the J -->
  <circle cx="22" cy="18" r="3" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="40" cy="18" r="3" fill="#34d399" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="40" cy="32" r="2.5" fill="#ffffff"/>
  <circle cx="17" cy="38" r="3" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5"/>
  
  <!-- Pulse Signal Dot -->
  <circle cx="28" cy="49" r="2" fill="#ffffff"/>
</svg>
