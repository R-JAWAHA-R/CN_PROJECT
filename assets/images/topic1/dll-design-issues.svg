<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520">
  <defs>
    <linearGradient id="bgG4" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#f8fafc"/><stop offset="100%" stop-color="#e2e8f0"/></linearGradient>
    <filter id="sh4"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#00000018"/></filter>
    <marker id="ar4" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6Z" fill="#10B981"/></marker>
  </defs>

  <rect width="800" height="520" fill="url(#bgG4)" rx="12"/>

  <!-- Title -->
  <text x="400" y="36" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#1e293b">Data Link Layer — Design Issues</text>

  <!-- Sender/Receiver connection at top -->
  <rect x="60" y="55" width="110" height="44" rx="8" fill="#3B82F6" filter="url(#sh4)"/>
  <text x="115" y="82" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="white">Sender</text>
  <rect x="630" y="55" width="110" height="44" rx="8" fill="#3B82F6" filter="url(#sh4)"/>
  <text x="685" y="82" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="white">Receiver</text>
  <!-- Connection line -->
  <line x1="170" y1="77" x2="630" y2="77" stroke="#10B981" stroke-width="3" stroke-dasharray="8,4"/>
  <rect x="310" y="63" width="180" height="28" rx="6" fill="#10B981"/>
  <text x="400" y="82" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="white">Data Link Layer Channel</text>
  <!-- Small frame icons on the line -->
  <rect x="220" y="70" width="30" height="14" rx="3" fill="#059669" stroke="white" stroke-width="1"/>
  <text x="235" y="80" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="7" fill="white">FRM</text>
  <rect x="550" y="70" width="30" height="14" rx="3" fill="#059669" stroke="white" stroke-width="1"/>
  <text x="565" y="80" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="7" fill="white">FRM</text>

  <!-- 4 Design Issue Cards -->
  <!-- Card 1: Services to Network Layer -->
  <rect x="20" y="120" width="370" height="170" rx="12" fill="white" stroke="#3B82F6" stroke-width="2" filter="url(#sh4)"/>
  <rect x="20" y="120" width="370" height="38" rx="12" fill="#3B82F6"/>
  <rect x="20" y="146" width="370" height="12" fill="#3B82F6"/>
  <text x="36" y="146" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="white">1. Services to Network Layer</text>
  <text x="36" y="178" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#475569">• Provide well-defined service interface</text>
  <text x="36" y="196" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#475569">• Three service types:</text>
  <rect x="48" y="204" width="90" height="18" rx="4" fill="#DBEAFE"/>
  <text x="93" y="217" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-weight="600" fill="#2563EB">Unacknowledged</text>
  <rect x="145" y="204" width="90" height="18" rx="4" fill="#DBEAFE"/>
  <text x="190" y="217" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-weight="600" fill="#2563EB">Acknowledged</text>
  <rect x="242" y="204" width="105" height="18" rx="4" fill="#DBEAFE"/>
  <text x="294" y="217" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-weight="600" fill="#2563EB">Connection-oriented</text>
  <text x="36" y="243" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#475569">• Abstract away physical layer complexity</text>
  <text x="36" y="261" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#475569">• Handle transmission errors transparently</text>
  <circle cx="370" y="272" r="3" fill="#3B82F6"/>

  <!-- Card 2: Framing -->
  <rect x="410" y="120" width="370" height="170" rx="12" fill="white" stroke="#10B981" stroke-width="2" filter="url(#sh4)"/>
  <rect x="410" y="120" width="370" height="38" rx="12" fill="#10B981"/>
  <rect x="410" y="146" width="370" height="12" fill="#10B981"/>
  <text x="426" y="146" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="white">2. Framing</text>
  <text x="426" y="178" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#475569">• Break bit stream into discrete frames</text>
  <text x="426" y="196" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#475569">• Add frame boundaries (delimiters)</text>
  <!-- Mini frame diagram -->
  <rect x="440" y="208" width="50" height="22" rx="3" fill="#A7F3D0" stroke="#059669" stroke-width="1"/>
  <text x="465" y="223" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="8" font-weight="600" fill="#059669">Header</text>
  <rect x="490" y="208" width="110" height="22" rx="0" fill="#D1FAE5" stroke="#059669" stroke-width="1"/>
  <text x="545" y="223" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="8" font-weight="600" fill="#059669">Payload Data</text>
  <rect x="600" y="208" width="50" height="22" rx="3" fill="#A7F3D0" stroke="#059669" stroke-width="1"/>
  <text x="625" y="223" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="8" font-weight="600" fill="#059669">Trailer</text>
  <text x="426" y="250" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#475569">• Methods: Char count, Flag bytes/bits,</text>
  <text x="436" y="266" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#475569">Physical coding violations</text>
  <text x="426" y="282" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#475569">• Detect frame start and end</text>

  <!-- Card 3: Error Control -->
  <rect x="20" y="310" width="370" height="170" rx="12" fill="white" stroke="#EF4444" stroke-width="2" filter="url(#sh4)"/>
  <rect x="20" y="310" width="370" height="38" rx="12" fill="#EF4444"/>
  <rect x="20" y="336" width="370" height="12" fill="#EF4444"/>
  <text x="36" y="336" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="white">3. Error Control</text>
  <text x="36" y="368" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#475569">• Ensure reliable delivery of frames</text>
  <text x="36" y="386" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#475569">• Error detection: CRC, Checksum, Parity</text>
  <text x="36" y="404" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#475569">• Error correction: Hamming codes, FEC</text>
  <text x="36" y="422" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#475569">• Retransmission: ARQ protocols</text>
  <text x="36" y="440" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#475569">• Sequence numbers to detect duplicates</text>
  <!-- Small icons -->
  <rect x="320" y="365" width="50" height="18" rx="3" fill="#FEE2E2"/>
  <text x="345" y="378" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="8" font-weight="600" fill="#EF4444">CRC</text>
  <rect x="320" y="388" width="50" height="18" rx="3" fill="#FEE2E2"/>
  <text x="345" y="401" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="8" font-weight="600" fill="#EF4444">ARQ</text>

  <!-- Card 4: Flow Control -->
  <rect x="410" y="310" width="370" height="170" rx="12" fill="white" stroke="#8B5CF6" stroke-width="2" filter="url(#sh4)"/>
  <rect x="410" y="310" width="370" height="38" rx="12" fill="#8B5CF6"/>
  <rect x="410" y="336" width="370" height="12" fill="#8B5CF6"/>
  <text x="426" y="336" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="white">4. Flow Control</text>
  <text x="426" y="368" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#475569">• Regulate data transmission rate</text>
  <text x="426" y="386" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#475569">• Prevent receiver buffer overflow</text>
  <text x="426" y="404" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#475569">• Feedback-based mechanisms:</text>
  <rect x="440" y="412" width="100" height="18" rx="4" fill="#EDE9FE"/>
  <text x="490" y="425" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-weight="600" fill="#7C3AED">Stop-and-Wait</text>
  <rect x="548" y="412" width="100" height="18" rx="4" fill="#EDE9FE"/>
  <text x="598" y="425" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-weight="600" fill="#7C3AED">Sliding Window</text>
  <text x="426" y="452" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#475569">• Rate-based and credit-based control</text>
  <text x="426" y="470" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#475569">• Window size determines throughput</text>

  <!-- Bottom note -->
  <text x="400" y="508" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#94a3b8" font-style="italic">These four design issues shape how the Data Link Layer is implemented in practice</text>
</svg>