<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 530">
  <defs>
    <marker id="sinkArrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#059669"/>
    </marker>
    <filter id="nodeShadow" x="-15%" y="-15%" width="140%" height="140%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { font: bold 20px 'Segoe UI', Arial, sans-serif; fill: #1E293B; }
      .subtitle { font: 14px 'Segoe UI', Arial, sans-serif; fill: #64748B; }
      .nlabel { font: bold 15px 'Segoe UI', Arial, sans-serif; fill: #fff; text-anchor: middle; dominant-baseline: central; }
      .wt { font: bold 11px 'Segoe UI', Arial, sans-serif; fill: #059669; text-anchor: middle; }
      .dist { font: bold 11px 'Segoe UI', Arial, sans-serif; fill: #1E40AF; text-anchor: middle; }
      .legend { font: 12px 'Segoe UI', Arial, sans-serif; fill: #475569; }
    </style>
  </defs>

  <rect width="800" height="530" fill="#FAFBFC" rx="8"/>

  <!-- Title -->
  <text x="400" y="32" class="title" text-anchor="middle">Sink Tree for Destination Node D</text>
  <text x="400" y="52" class="subtitle" text-anchor="middle">All shortest paths converge toward destination D — edge weights shown on each link</text>

  <!-- Tree structure: D at bottom center, paths flow downward to D -->

  <!-- Edges of the sink tree (green arrows pointing toward D) -->
  <!-- Level 3 → Level 2 -->
  <line x1="100" y1="115" x2="200" y2="215" stroke="#10B981" stroke-width="2.5" marker-end="url(#sinkArrow)"/>
  <line x1="300" y1="115" x2="200" y2="215" stroke="#10B981" stroke-width="2.5" marker-end="url(#sinkArrow)"/>
  <line x1="500" y1="115" x2="480" y2="215" stroke="#10B981" stroke-width="2.5" marker-end="url(#sinkArrow)"/>
  <line x1="700" y1="115" x2="600" y2="215" stroke="#10B981" stroke-width="2.5" marker-end="url(#sinkArrow)"/>

  <!-- Level 2 → Level 1 -->
  <line x1="200" y1="235" x2="300" y2="335" stroke="#10B981" stroke-width="2.5" marker-end="url(#sinkArrow)"/>
  <line x1="480" y1="235" x2="500" y2="335" stroke="#10B981" stroke-width="2.5" marker-end="url(#sinkArrow)"/>
  <line x1="600" y1="235" x2="500" y2="335" stroke="#10B981" stroke-width="2.5" marker-end="url(#sinkArrow)"/>

  <!-- Level 1 → Destination D -->
  <line x1="300" y1="355" x2="400" y2="440" stroke="#10B981" stroke-width="3" marker-end="url(#sinkArrow)"/>
  <line x1="500" y1="355" x2="400" y2="440" stroke="#10B981" stroke-width="3" marker-end="url(#sinkArrow)"/>

  <!-- Edge weight labels -->
  <!-- Level 3 → 2 -->
  <rect x="130" y="153" width="26" height="18" rx="4" fill="#D1FAE5"/>
  <text x="143" y="166" class="wt">3</text>
  <rect x="237" y="153" width="26" height="18" rx="4" fill="#D1FAE5"/>
  <text x="250" y="166" class="wt">4</text>
  <rect x="480" y="153" width="26" height="18" rx="4" fill="#D1FAE5"/>
  <text x="493" y="166" class="wt">2</text>
  <rect x="642" y="153" width="26" height="18" rx="4" fill="#D1FAE5"/>
  <text x="655" y="166" class="wt">5</text>

  <!-- Level 2 → 1 -->
  <rect x="233" y="275" width="26" height="18" rx="4" fill="#D1FAE5"/>
  <text x="246" y="288" class="wt">2</text>
  <rect x="478" y="275" width="26" height="18" rx="4" fill="#D1FAE5"/>
  <text x="491" y="288" class="wt">3</text>
  <rect x="543" y="275" width="26" height="18" rx="4" fill="#D1FAE5"/>
  <text x="556" y="288" class="wt">4</text>

  <!-- Level 1 → D -->
  <rect x="333" y="390" width="26" height="18" rx="4" fill="#D1FAE5"/>
  <text x="346" y="403" class="wt">1</text>
  <rect x="443" y="390" width="26" height="18" rx="4" fill="#D1FAE5"/>
  <text x="456" y="403" class="wt">2</text>

  <!-- Level 3 nodes (sources, top) -->
  <circle cx="100" cy="105" r="22" fill="#60A5FA" filter="url(#nodeShadow)"/>
  <text x="100" y="105" class="nlabel">A</text>
  <rect x="75" y="72" width="50" height="18" rx="4" fill="#EFF6FF"/>
  <text x="100" y="85" class="dist">d=10</text>

  <circle cx="300" cy="105" r="22" fill="#60A5FA" filter="url(#nodeShadow)"/>
  <text x="300" y="105" class="nlabel">B</text>
  <rect x="275" y="72" width="50" height="18" rx="4" fill="#EFF6FF"/>
  <text x="300" y="85" class="dist">d=8</text>

  <circle cx="500" cy="105" r="22" fill="#60A5FA" filter="url(#nodeShadow)"/>
  <text x="500" y="105" class="nlabel">F</text>
  <rect x="475" y="72" width="50" height="18" rx="4" fill="#EFF6FF"/>
  <text x="500" y="85" class="dist">d=7</text>

  <circle cx="700" cy="105" r="22" fill="#60A5FA" filter="url(#nodeShadow)"/>
  <text x="700" y="105" class="nlabel">G</text>
  <rect x="675" y="72" width="50" height="18" rx="4" fill="#EFF6FF"/>
  <text x="700" y="85" class="dist">d=11</text>

  <!-- Level 2 nodes (intermediate) -->
  <circle cx="200" cy="225" r="22" fill="#3B82F6" filter="url(#nodeShadow)"/>
  <text x="200" y="225" class="nlabel">C</text>
  <rect x="175" y="192" width="50" height="18" rx="4" fill="#EFF6FF"/>
  <text x="200" y="205" class="dist">d=4</text>

  <circle cx="480" cy="225" r="22" fill="#3B82F6" filter="url(#nodeShadow)"/>
  <text x="480" y="225" class="nlabel">H</text>
  <rect x="455" y="192" width="50" height="18" rx="4" fill="#EFF6FF"/>
  <text x="480" y="205" class="dist">d=5</text>

  <circle cx="600" cy="225" r="22" fill="#3B82F6" filter="url(#nodeShadow)"/>
  <text x="600" y="225" class="nlabel">I</text>
  <rect x="575" y="192" width="50" height="18" rx="4" fill="#EFF6FF"/>
  <text x="600" y="205" class="dist">d=6</text>

  <!-- Level 1 nodes -->
  <circle cx="300" cy="345" r="22" fill="#2563EB" filter="url(#nodeShadow)"/>
  <text x="300" y="345" class="nlabel">E</text>
  <rect x="275" y="312" width="50" height="18" rx="4" fill="#EFF6FF"/>
  <text x="300" y="325" class="dist">d=1</text>

  <circle cx="500" cy="345" r="22" fill="#2563EB" filter="url(#nodeShadow)"/>
  <text x="500" y="345" class="nlabel">J</text>
  <rect x="475" y="312" width="50" height="18" rx="4" fill="#EFF6FF"/>
  <text x="500" y="325" class="dist">d=2</text>

  <!-- Destination D -->
  <circle cx="400" cy="450" r="28" fill="#059669" stroke="#047857" stroke-width="3" filter="url(#nodeShadow)"/>
  <text x="400" y="450" class="nlabel" style="font-size:18px">D</text>
  <rect x="370" y="480" width="60" height="20" rx="4" fill="#D1FAE5" stroke="#059669" stroke-width="1"/>
  <text x="400" y="494" style="font:bold 12px 'Segoe UI',sans-serif; fill:#059669; text-anchor:middle;">DEST (d=0)</text>

  <!-- Legend -->
  <rect x="30" y="486" width="340" height="36" rx="6" fill="#F0FDF4" stroke="#BBF7D0"/>
  <line x1="45" y1="504" x2="75" y2="504" stroke="#10B981" stroke-width="2.5" marker-end="url(#sinkArrow)"/>
  <text x="82" y="509" class="legend">Shortest path direction toward sink</text>
  <rect x="240" y="496" width="30" height="16" rx="3" fill="#EFF6FF"/>
  <text x="255" y="508" class="dist">d=x</text>
  <text x="278" y="509" class="legend">= total cost</text>

  <!-- Annotation box -->
  <rect x="500" y="486" width="280" height="36" rx="6" fill="#FFF7ED" stroke="#FDBA74"/>
  <text x="640" y="509" style="font:13px 'Segoe UI',sans-serif; fill:#92400E; text-anchor:middle;">All paths merge into tree — no loops</text>
</svg>