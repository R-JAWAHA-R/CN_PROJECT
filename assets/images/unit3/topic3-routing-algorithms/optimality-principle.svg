<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520">
  <defs>
    <marker id="arrowGreen" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#059669"/>
    </marker>
    <filter id="shadow1" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.15"/>
    </filter>
    <style>
      .title { font: bold 20px 'Segoe UI', Arial, sans-serif; fill: #1E293B; }
      .subtitle { font: 14px 'Segoe UI', Arial, sans-serif; fill: #64748B; }
      .node-label { font: bold 16px 'Segoe UI', Arial, sans-serif; fill: #fff; text-anchor: middle; dominant-baseline: central; }
      .weight { font: bold 12px 'Segoe UI', Arial, sans-serif; fill: #334155; text-anchor: middle; }
      .legend-text { font: 13px 'Segoe UI', Arial, sans-serif; fill: #334155; }
      .note-text { font: 13px 'Segoe UI', Arial, sans-serif; fill: #475569; }
      .note-bold { font: bold 13px 'Segoe UI', Arial, sans-serif; fill: #059669; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="800" height="520" fill="#FAFBFC" rx="8"/>

  <!-- Title -->
  <text x="400" y="35" class="title" text-anchor="middle">The Optimality Principle in Routing</text>
  <text x="400" y="56" class="subtitle" text-anchor="middle">If node J is on the optimal path from I to K, then the path from J to K is also optimal</text>

  <!-- Network Graph -->
  <!-- Non-tree edges (dashed gray) -->
  <line x1="200" y1="150" x2="400" y2="120" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="6,4"/>
  <line x1="200" y1="150" x2="350" y2="300" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="6,4"/>
  <line x1="400" y1="120" x2="600" y2="150" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="6,4"/>
  <line x1="550" y1="300" x2="350" y2="300" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="6,4"/>
  <line x1="200" y1="150" x2="150" y2="310" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="6,4"/>

  <!-- Optimal tree edges (green, thicker) -->
  <line x1="400" y1="430" x2="350" y2="300" stroke="#059669" stroke-width="3.5" marker-end="url(#arrowGreen)"/>
  <line x1="400" y1="430" x2="550" y2="300" stroke="#059669" stroke-width="3.5" marker-end="url(#arrowGreen)"/>
  <line x1="350" y1="300" x2="150" y2="310" stroke="#059669" stroke-width="3.5" marker-end="url(#arrowGreen)"/>
  <line x1="350" y1="300" x2="200" y2="150" stroke="#059669" stroke-width="3.5" marker-end="url(#arrowGreen)"/>
  <line x1="550" y1="300" x2="400" y2="120" stroke="#059669" stroke-width="3.5" marker-end="url(#arrowGreen)"/>
  <line x1="550" y1="300" x2="600" y2="150" stroke="#059669" stroke-width="3.5" marker-end="url(#arrowGreen)"/>

  <!-- Edge weights on optimal paths -->
  <rect x="358" y="355" width="28" height="20" rx="4" fill="#D1FAE5"/>
  <text x="372" y="369" class="weight" fill="#059669">3</text>

  <rect x="465" y="355" width="28" height="20" rx="4" fill="#D1FAE5"/>
  <text x="479" y="369" class="weight" fill="#059669">2</text>

  <rect x="230" y="295" width="28" height="20" rx="4" fill="#D1FAE5"/>
  <text x="244" y="309" class="weight" fill="#059669">4</text>

  <rect x="258" y="210" width="28" height="20" rx="4" fill="#D1FAE5"/>
  <text x="272" y="224" class="weight" fill="#059669">5</text>

  <rect x="458" y="195" width="28" height="20" rx="4" fill="#D1FAE5"/>
  <text x="472" y="209" class="weight" fill="#059669">3</text>

  <rect x="562" y="210" width="28" height="20" rx="4" fill="#D1FAE5"/>
  <text x="576" y="224" class="weight" fill="#059669">4</text>

  <!-- Dashed edge weights -->
  <text x="295" y="123" class="weight" fill="#94A3B8">7</text>
  <text x="505" y="123" class="weight" fill="#94A3B8">8</text>
  <text x="255" y="240" class="weight" fill="#94A3B8">9</text>
  <text x="450" y="290" class="weight" fill="#94A3B8">6</text>
  <text x="158" y="240" class="weight" fill="#94A3B8">6</text>

  <!-- Nodes -->
  <!-- Node A (source) -->
  <circle cx="200" cy="150" r="24" fill="#3B82F6" filter="url(#shadow1)"/>
  <text x="200" y="150" class="node-label">A</text>

  <!-- Node B -->
  <circle cx="400" cy="120" r="24" fill="#3B82F6" filter="url(#shadow1)"/>
  <text x="400" y="120" class="node-label">B</text>

  <!-- Node C -->
  <circle cx="600" cy="150" r="24" fill="#3B82F6" filter="url(#shadow1)"/>
  <text x="600" y="150" class="node-label">C</text>

  <!-- Node D -->
  <circle cx="150" cy="310" r="24" fill="#3B82F6" filter="url(#shadow1)"/>
  <text x="150" y="310" class="node-label">D</text>

  <!-- Node E -->
  <circle cx="350" cy="300" r="24" fill="#3B82F6" filter="url(#shadow1)"/>
  <text x="350" y="300" class="node-label">E</text>

  <!-- Node F -->
  <circle cx="550" cy="300" r="24" fill="#3B82F6" filter="url(#shadow1)"/>
  <text x="550" y="300" class="node-label">F</text>

  <!-- Destination/Sink node K -->
  <circle cx="400" cy="430" r="28" fill="#059669" stroke="#047857" stroke-width="3" filter="url(#shadow1)"/>
  <text x="400" y="430" class="node-label" style="font-size:18px">K</text>
  <text x="400" y="465" style="font:bold 12px 'Segoe UI',sans-serif; fill:#059669; text-anchor:middle;">DESTINATION (Sink)</text>

  <!-- Legend -->
  <rect x="30" y="470" width="740" height="44" rx="6" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1"/>
  <line x1="55" y1="492" x2="95" y2="492" stroke="#059669" stroke-width="3"/>
  <text x="102" y="497" class="legend-text">Optimal tree edge (sink tree)</text>
  <line x1="310" y1="492" x2="350" y2="492" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="357" y="497" class="legend-text">Non-tree edge</text>
  <circle cx="545" cy="492" r="8" fill="#059669"/>
  <text x="560" y="497" class="legend-text">Sink/Destination</text>

  <!-- Annotation -->
  <rect x="570" y="375" width="210" height="70" rx="6" fill="#FFF7ED" stroke="#FDBA74" stroke-width="1"/>
  <text x="675" y="397" class="note-bold" text-anchor="middle">Optimality Principle:</text>
  <text x="675" y="415" class="note-text" text-anchor="middle">All optimal paths to K</text>
  <text x="675" y="433" class="note-text" text-anchor="middle">form a sink tree</text>
</svg>