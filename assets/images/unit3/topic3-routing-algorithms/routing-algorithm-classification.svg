<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 520">
  <defs>
    <filter id="clSh" x="-5%" y="-5%" width="115%" height="120%">
      <feDropShadow dx="1" dy="2" stdDeviation="2.5" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { font: bold 20px 'Segoe UI', Arial, sans-serif; fill: #1E293B; }
      .sub { font: 13px 'Segoe UI', Arial, sans-serif; fill: #64748B; }
      .rootLabel { font: bold 16px 'Segoe UI', Arial, sans-serif; fill: #fff; text-anchor: middle; dominant-baseline: central; }
      .catLabel { font: bold 14px 'Segoe UI', Arial, sans-serif; fill: #fff; text-anchor: middle; dominant-baseline: central; }
      .leafLabel { font: bold 12px 'Segoe UI', Arial, sans-serif; fill: #1E293B; text-anchor: middle; }
      .leafDesc { font: 11px 'Segoe UI', Arial, sans-serif; fill: #475569; text-anchor: middle; }
    </style>
  </defs>

  <rect width="850" height="520" fill="#FAFBFC" rx="8"/>

  <text x="425" y="32" class="title" text-anchor="middle">Classification of Routing Algorithms</text>
  <text x="425" y="52" class="sub" text-anchor="middle">Hierarchical taxonomy of routing approaches used in computer networks</text>

  <!-- Root node -->
  <rect x="300" y="70" width="250" height="44" rx="22" fill="#1E293B" filter="url(#clSh)"/>
  <text x="425" y="96" class="rootLabel">Routing Algorithms</text>

  <!-- Connector lines from root -->
  <line x1="370" y1="114" x2="200" y2="170" stroke="#94A3B8" stroke-width="2.5"/>
  <line x1="480" y1="114" x2="650" y2="170" stroke="#94A3B8" stroke-width="2.5"/>

  <!-- ===== STATIC (Left branch) ===== -->
  <rect x="105" y="165" width="190" height="40" rx="20" fill="#2563EB" filter="url(#clSh)"/>
  <text x="200" y="189" class="catLabel">Static (Non-Adaptive)</text>

  <!-- Connectors from Static -->
  <line x1="155" y1="205" x2="105" y2="270" stroke="#60A5FA" stroke-width="2"/>
  <line x1="245" y1="205" x2="295" y2="270" stroke="#60A5FA" stroke-width="2"/>

  <!-- Static leaf 1: Shortest Path -->
  <rect x="20" y="265" width="170" height="90" rx="10" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1.5" filter="url(#clSh)"/>
  <text x="105" y="290" class="leafLabel" fill="#2563EB">Shortest Path</text>
  <line x1="35" y1="298" x2="175" y2="298" stroke="#BFDBFE"/>
  <text x="105" y="316" class="leafDesc">Dijkstra's algorithm</text>
  <text x="105" y="332" class="leafDesc">Pre-computed optimal</text>
  <text x="105" y="348" class="leafDesc">paths using weights</text>

  <!-- Static leaf 2: Flooding -->
  <rect x="210" y="265" width="170" height="90" rx="10" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1.5" filter="url(#clSh)"/>
  <text x="295" y="290" class="leafLabel" fill="#2563EB">Flooding</text>
  <line x1="225" y1="298" x2="365" y2="298" stroke="#BFDBFE"/>
  <text x="295" y="316" class="leafDesc">Send to all neighbors</text>
  <text x="295" y="332" class="leafDesc">No routing knowledge</text>
  <text x="295" y="348" class="leafDesc">needed; very robust</text>

  <!-- ===== DYNAMIC (Right branch) ===== -->
  <rect x="555" y="165" width="190" height="40" rx="20" fill="#EA580C" filter="url(#clSh)"/>
  <text x="650" y="189" class="catLabel">Dynamic (Adaptive)</text>

  <!-- Connectors from Dynamic -->
  <line x1="605" y1="205" x2="540" y2="270" stroke="#F97316" stroke-width="2"/>
  <line x1="695" y1="205" x2="740" y2="270" stroke="#F97316" stroke-width="2"/>

  <!-- Dynamic leaf 1: Distance Vector -->
  <rect x="450" y="265" width="180" height="90" rx="10" fill="#FFF7ED" stroke="#FDBA74" stroke-width="1.5" filter="url(#clSh)"/>
  <text x="540" y="290" class="leafLabel" fill="#EA580C">Distance Vector</text>
  <line x1="465" y1="298" x2="615" y2="298" stroke="#FDBA74"/>
  <text x="540" y="316" class="leafDesc">Bellman-Ford based</text>
  <text x="540" y="332" class="leafDesc">Exchange tables with</text>
  <text x="540" y="348" class="leafDesc">neighbors (e.g., RIP)</text>

  <!-- Dynamic leaf 2: Link State -->
  <rect x="650" y="265" width="180" height="90" rx="10" fill="#FFF7ED" stroke="#FDBA74" stroke-width="1.5" filter="url(#clSh)"/>
  <text x="740" y="290" class="leafLabel" fill="#EA580C">Link State</text>
  <line x1="665" y1="298" x2="815" y2="298" stroke="#FDBA74"/>
  <text x="740" y="316" class="leafDesc">Flood link info to all</text>
  <text x="740" y="332" class="leafDesc">Build complete map</text>
  <text x="740" y="348" class="leafDesc">(e.g., OSPF, IS-IS)</text>

  <!-- Additional sub-branches for Static -->
  <rect x="20" y="380" width="170" height="25" rx="5" fill="#DBEAFE"/>
  <text x="105" y="397" style="font:10px 'Segoe UI',sans-serif; fill:#1E40AF; text-anchor:middle;">Uses: Small/stable networks</text>

  <rect x="210" y="380" width="170" height="25" rx="5" fill="#DBEAFE"/>
  <text x="295" y="397" style="font:10px 'Segoe UI',sans-serif; fill:#1E40AF; text-anchor:middle;">Uses: Broadcasting, military</text>

  <!-- Additional sub-branches for Dynamic -->
  <rect x="450" y="380" width="180" height="25" rx="5" fill="#FFEDD5"/>
  <text x="540" y="397" style="font:10px 'Segoe UI',sans-serif; fill:#9A3412; text-anchor:middle;">Uses: Small-medium networks</text>

  <rect x="650" y="380" width="180" height="25" rx="5" fill="#FFEDD5"/>
  <text x="740" y="397" style="font:10px 'Segoe UI',sans-serif; fill:#9A3412; text-anchor:middle;">Uses: Large enterprise/ISP</text>

  <!-- Comparison bar at bottom -->
  <rect x="20" y="425" width="810" height="85" rx="8" fill="#fff" stroke="#E2E8F0"/>
  <text x="425" y="448" style="font:bold 14px 'Segoe UI',sans-serif; fill:#1E293B; text-anchor:middle;">Key Differences</text>

  <!-- Static side -->
  <rect x="35" y="455" width="380" height="45" rx="6" fill="#EFF6FF" stroke="#BFDBFE"/>
  <text x="225" y="472" style="font:bold 12px 'Segoe UI',sans-serif; fill:#2563EB; text-anchor:middle;">Static Routing</text>
  <text x="225" y="490" style="font:11px 'Segoe UI',sans-serif; fill:#475569; text-anchor:middle;">Routes computed offline · Does not adapt to changes · Lower overhead</text>

  <!-- Dynamic side -->
  <rect x="435" y="455" width="380" height="45" rx="6" fill="#FFF7ED" stroke="#FDBA74"/>
  <text x="625" y="472" style="font:bold 12px 'Segoe UI',sans-serif; fill:#EA580C; text-anchor:middle;">Dynamic Routing</text>
  <text x="625" y="490" style="font:11px 'Segoe UI',sans-serif; fill:#475569; text-anchor:middle;">Routes adapt in real-time · Handles failures · Higher overhead</text>

  <!-- VS divider -->
  <circle cx="425" cy="477" r="14" fill="#1E293B"/>
  <text x="425" y="481" style="font:bold 10px sans-serif; fill:white; text-anchor:middle;">VS</text>
</svg>