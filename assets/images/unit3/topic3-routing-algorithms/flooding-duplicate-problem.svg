<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 530">
  <defs>
    <marker id="dpArrow" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#DC2626"/>
    </marker>
    <marker id="solArrow" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5 Z" fill="#059669"/>
    </marker>
    <filter id="dpSh" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="1" dy="1.5" stdDeviation="1.5" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { font: bold 20px 'Segoe UI', Arial, sans-serif; fill: #1E293B; }
      .sub { font: 13px 'Segoe UI', Arial, sans-serif; fill: #64748B; }
      .nlbl { font: bold 14px 'Segoe UI', Arial, sans-serif; fill: #fff; text-anchor: middle; dominant-baseline: central; }
      .pktlbl { font: bold 10px 'Segoe UI', Arial, sans-serif; text-anchor: middle; }
      .heading { font: bold 15px 'Segoe UI', Arial, sans-serif; }
      .body { font: 12px 'Segoe UI', Arial, sans-serif; fill: #334155; }
      .bodybold { font: bold 12px 'Segoe UI', Arial, sans-serif; fill: #1E293B; }
    </style>
  </defs>

  <rect width="850" height="530" fill="#FAFBFC" rx="8"/>

  <text x="425" y="32" class="title" text-anchor="middle">Flooding — Duplicate Packet Problem &amp; Solutions</text>
  <text x="425" y="52" class="sub" text-anchor="middle">Multiple copies of the same packet arrive at a node via different paths</text>

  <!-- ===== LEFT: The Problem ===== -->
  <rect x="15" y="70" width="400" height="305" rx="8" fill="#FEF2F2" stroke="#FECACA"/>
  <rect x="15" y="70" width="400" height="28" rx="8" fill="#DC2626"/>
  <rect x="15" y="90" width="400" height="8" fill="#DC2626"/>
  <text x="215" y="90" style="font:bold 13px 'Segoe UI',sans-serif; fill:white; text-anchor:middle;">⚠ THE PROBLEM: Duplicate Packets</text>

  <!-- Network showing duplicates arriving at node D -->
  <!-- Edges -->
  <line x1="100" y1="160" x2="210" y2="160" stroke="#CBD5E1" stroke-width="1.5"/>
  <line x1="100" y1="160" x2="100" y2="270" stroke="#CBD5E1" stroke-width="1.5"/>
  <line x1="100" y1="160" x2="210" y2="270" stroke="#CBD5E1" stroke-width="1.5"/>
  <line x1="210" y1="160" x2="320" y2="160" stroke="#CBD5E1" stroke-width="1.5"/>
  <line x1="210" y1="160" x2="210" y2="270" stroke="#CBD5E1" stroke-width="1.5"/>
  <line x1="320" y1="160" x2="320" y2="270" stroke="#CBD5E1" stroke-width="1.5"/>
  <line x1="100" y1="270" x2="210" y2="270" stroke="#CBD5E1" stroke-width="1.5"/>
  <line x1="210" y1="270" x2="320" y2="270" stroke="#CBD5E1" stroke-width="1.5"/>

  <!-- Duplicate packet arrows converging on D (node at 210,270) -->
  <!-- Path 1: S→B→D -->
  <line x1="122" y1="160" x2="188" y2="160" stroke="#DC2626" stroke-width="2" marker-end="url(#dpArrow)"/>
  <line x1="210" y1="178" x2="210" y2="250" stroke="#DC2626" stroke-width="2" marker-end="url(#dpArrow)"/>
  <!-- Path 2: S→C→D -->
  <line x1="100" y1="180" x2="100" y2="250" stroke="#DC2626" stroke-width="2" marker-end="url(#dpArrow)"/>
  <line x1="118" y1="270" x2="190" y2="270" stroke="#DC2626" stroke-width="2" marker-end="url(#dpArrow)"/>
  <!-- Path 3: S→B→E→D -->
  <line x1="232" y1="160" x2="300" y2="160" stroke="#DC2626" stroke-width="2" marker-end="url(#dpArrow)"/>
  <line x1="320" y1="178" x2="320" y2="250" stroke="#DC2626" stroke-width="2" marker-end="url(#dpArrow)"/>
  <line x1="300" y1="270" x2="230" y2="270" stroke="#DC2626" stroke-width="2" marker-end="url(#dpArrow)"/>

  <!-- Packet icons on paths -->
  <rect x="145" y="147" width="28" height="16" rx="3" fill="#FCA5A5"/>
  <text x="159" y="159" class="pktlbl" fill="#DC2626">P</text>
  <rect x="196" y="210" width="28" height="16" rx="3" fill="#FCA5A5"/>
  <text x="210" y="222" class="pktlbl" fill="#DC2626">P</text>
  <rect x="86" y="220" width="28" height="16" rx="3" fill="#FCA5A5"/>
  <text x="100" y="232" class="pktlbl" fill="#DC2626">P</text>
  <rect x="148" y="257" width="28" height="16" rx="3" fill="#FCA5A5"/>
  <text x="162" y="269" class="pktlbl" fill="#DC2626">P</text>
  <rect x="306" y="210" width="28" height="16" rx="3" fill="#FCA5A5"/>
  <text x="320" y="222" class="pktlbl" fill="#DC2626">P</text>
  <rect x="260" y="257" width="28" height="16" rx="3" fill="#FCA5A5"/>
  <text x="274" y="269" class="pktlbl" fill="#DC2626">P</text>

  <!-- Nodes -->
  <circle cx="100" cy="160" r="18" fill="#EA580C" filter="url(#dpSh)"/>
  <text x="100" y="160" class="nlbl" style="font-size:12px">S</text>
  <text x="100" y="140" style="font:bold 9px sans-serif; fill:#EA580C; text-anchor:middle;">SRC</text>

  <circle cx="210" cy="160" r="18" fill="#3B82F6" filter="url(#dpSh)"/>
  <text x="210" y="160" class="nlbl" style="font-size:12px">B</text>

  <circle cx="320" cy="160" r="18" fill="#3B82F6" filter="url(#dpSh)"/>
  <text x="320" y="160" class="nlbl" style="font-size:12px">E</text>

  <circle cx="100" cy="270" r="18" fill="#3B82F6" filter="url(#dpSh)"/>
  <text x="100" y="270" class="nlbl" style="font-size:12px">C</text>

  <circle cx="320" cy="270" r="18" fill="#3B82F6" filter="url(#dpSh)"/>
  <text x="320" y="270" class="nlbl" style="font-size:12px">F</text>

  <!-- Target node D with alert -->
  <circle cx="210" cy="270" r="20" fill="#DC2626" stroke="#991B1B" stroke-width="2.5" filter="url(#dpSh)"/>
  <text x="210" y="270" class="nlbl" style="font-size:14px">D</text>

  <!-- Exclamation -->
  <text x="210" y="302" style="font:bold 12px sans-serif; fill:#DC2626; text-anchor:middle;">⚠ 3 copies arrive!</text>

  <!-- Path labels -->
  <text x="60" y="330" class="body" style="fill:#991B1B;">Path 1: S → B → D</text>
  <text x="60" y="348" class="body" style="fill:#991B1B;">Path 2: S → C → D</text>
  <text x="60" y="366" class="body" style="fill:#991B1B;">Path 3: S → B → E → F → D</text>

  <!-- ===== RIGHT: Solutions ===== -->
  <rect x="430" y="70" width="405" height="305" rx="8" fill="#F0FDF4" stroke="#BBF7D0"/>
  <rect x="430" y="70" width="405" height="28" rx="8" fill="#059669"/>
  <rect x="430" y="90" width="405" height="8" fill="#059669"/>
  <text x="632" y="90" style="font:bold 13px 'Segoe UI',sans-serif; fill:white; text-anchor:middle;">✓ SOLUTIONS to Duplicate Problem</text>

  <!-- Solution 1: Sequence Numbers -->
  <rect x="445" y="110" width="375" height="100" rx="6" fill="#ECFDF5" stroke="#A7F3D0"/>
  <text x="460" y="132" class="heading" fill="#059669">① Sequence Number Method</text>
  <text x="460" y="152" class="body">Each source tags packets with a sequence number.</text>
  <text x="460" y="170" class="body">Routers track (source, seq#) pairs seen.</text>
  <text x="460" y="188" class="bodybold">→ Duplicate = same (source, seq#) → DROP</text>

  <!-- Packet illustration -->
  <rect x="700" y="130" width="105" height="60" rx="4" fill="#fff" stroke="#059669" stroke-width="1.5"/>
  <text x="752" y="148" style="font:bold 10px sans-serif; fill:#059669; text-anchor:middle;">Packet Header</text>
  <line x1="700" y1="154" x2="805" y2="154" stroke="#BBF7D0"/>
  <text x="752" y="168" style="font:9px sans-serif; fill:#334155; text-anchor:middle;">Src: S</text>
  <text x="752" y="182" style="font:bold 10px sans-serif; fill:#2563EB; text-anchor:middle;">Seq#: 42</text>

  <!-- Solution 2: TTL / Hop Count -->
  <rect x="445" y="220" width="375" height="100" rx="6" fill="#ECFDF5" stroke="#A7F3D0"/>
  <text x="460" y="242" class="heading" fill="#059669">② TTL (Time-To-Live) / Hop Counter</text>
  <text x="460" y="262" class="body">Packet initialized with TTL = network diameter.</text>
  <text x="460" y="280" class="body">Each hop decrements TTL by 1.</text>
  <text x="460" y="298" class="bodybold">→ When TTL = 0 → DISCARD packet</text>

  <!-- TTL illustration -->
  <rect x="700" y="235" width="105" height="75" rx="4" fill="#fff" stroke="#059669" stroke-width="1.5"/>
  <text x="752" y="252" style="font:bold 10px sans-serif; fill:#059669; text-anchor:middle;">TTL Countdown</text>
  <line x1="700" y1="258" x2="805" y2="258" stroke="#BBF7D0"/>
  <text x="752" y="274" style="font:10px sans-serif; fill:#334155; text-anchor:middle;">Start: TTL=4</text>
  <text x="752" y="290" style="font:10px sans-serif; fill:#F97316; text-anchor:middle;">Hop 1: TTL=3</text>
  <text x="752" y="306" style="font:10px sans-serif; fill:#DC2626; text-anchor:middle;">...TTL=0 → ✕</text>

  <!-- Comparison table -->
  <rect x="445" y="330" width="375" height="38" rx="4" fill="#D1FAE5" stroke="#059669" stroke-width="1"/>
  <text x="530" y="348" style="font:bold 11px sans-serif; fill:#047857; text-anchor:middle;">Seq# Method</text>
  <text x="530" y="362" style="font:10px sans-serif; fill:#334155; text-anchor:middle;">Exact duplicate detection</text>
  <line x1="632" y1="335" x2="632" y2="363" stroke="#059669"/>
  <text x="730" y="348" style="font:bold 11px sans-serif; fill:#047857; text-anchor:middle;">TTL Method</text>
  <text x="730" y="362" style="font:10px sans-serif; fill:#334155; text-anchor:middle;">Limits packet lifetime</text>

  <!-- Bottom summary -->
  <rect x="15" y="385" width="820" height="55" rx="6" fill="#EFF6FF" stroke="#BFDBFE"/>
  <text x="425" y="408" style="font:bold 14px 'Segoe UI',sans-serif; fill:#1E40AF; text-anchor:middle;">Why Duplicates Are a Problem</text>
  <text x="60" y="430" class="body">• Wastes bandwidth — same data transmitted multiple times over links</text>
  <text x="460" y="430" class="body">• Increases processing load at every router</text>

  <!-- Visual process flow at bottom -->
  <rect x="15" y="450" width="820" height="70" rx="6" fill="#fff" stroke="#E2E8F0"/>
  <text x="425" y="472" style="font:bold 13px 'Segoe UI',sans-serif; fill:#1E293B; text-anchor:middle;">Duplicate Handling Process</text>

  <!-- Flow: Packet arrives → Check seq# → Seen before? → Yes: Drop / No: Forward -->
  <rect x="40" y="482" width="90" height="28" rx="5" fill="#DBEAFE" stroke="#3B82F6"/>
  <text x="85" y="500" style="font:10px sans-serif; fill:#1E40AF; text-anchor:middle;">Pkt arrives</text>

  <text x="140" y="500" style="font:12px sans-serif; fill:#94A3B8; text-anchor:middle;">→</text>

  <rect x="155" y="482" width="100" height="28" rx="5" fill="#DBEAFE" stroke="#3B82F6"/>
  <text x="205" y="500" style="font:10px sans-serif; fill:#1E40AF; text-anchor:middle;">Check seq#/TTL</text>

  <text x="265" y="500" style="font:12px sans-serif; fill:#94A3B8; text-anchor:middle;">→</text>

  <rect x="280" y="482" width="100" height="28" rx="5" fill="#FEF3C7" stroke="#F59E0B"/>
  <text x="330" y="500" style="font:bold 10px sans-serif; fill:#92400E; text-anchor:middle;">Duplicate?</text>

  <!-- Yes branch -->
  <text x="400" y="490" style="font:10px sans-serif; fill:#DC2626; text-anchor:middle;">Yes →</text>
  <rect x="425" y="482" width="85" height="28" rx="5" fill="#FEE2E2" stroke="#DC2626"/>
  <text x="467" y="500" style="font:bold 10px sans-serif; fill:#DC2626; text-anchor:middle;">DROP ✕</text>

  <!-- No branch -->
  <text x="555" y="500" style="font:10px sans-serif; fill:#059669; text-anchor:middle;">No →</text>
  <rect x="580" y="482" width="110" height="28" rx="5" fill="#D1FAE5" stroke="#059669"/>
  <text x="635" y="500" style="font:bold 10px sans-serif; fill:#059669; text-anchor:middle;">FORWARD ✓</text>

  <text x="710" y="500" style="font:10px sans-serif; fill:#64748B; text-anchor:middle;">→</text>

  <rect x="730" y="482" width="95" height="28" rx="5" fill="#D1FAE5" stroke="#059669"/>
  <text x="777" y="500" style="font:bold 10px sans-serif; fill:#059669; text-anchor:middle;">Record seq#</text>
</svg>