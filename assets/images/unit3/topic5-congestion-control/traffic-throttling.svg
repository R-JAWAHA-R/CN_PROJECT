<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <marker id="tB" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6Z" fill="#2563EB"/></marker>
    <marker id="tR" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6Z" fill="#DC2626"/></marker>
    <marker id="tG" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6Z" fill="#059669"/></marker>
    <marker id="tO" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6Z" fill="#EA580C"/></marker>
  </defs>
  <style>
    text { font-family: 'Segoe UI', Arial, sans-serif; }
    .title { font-size: 18px; font-weight: 700; fill: #1E293B; }
    .subtitle { font-size: 12px; fill: #64748B; }
    .label { font-size: 11px; fill: #334155; }
    .small { font-size: 10px; fill: #64748B; }
    .step { font-size: 11px; font-weight: 600; }
  </style>
  <rect width="800" height="500" fill="#FFFFFF" rx="8"/>
  <text x="400" y="28" text-anchor="middle" class="title">Traffic Throttling Mechanism</text>
  <text x="400" y="46" text-anchor="middle" class="subtitle">Router detects congestion → sends feedback → source reduces rate</text>

  <!-- ===== NETWORK DIAGRAM (Top) ===== -->
  <!-- Source -->
  <rect x="30" y="80" width="80" height="50" rx="8" fill="#DBEAFE" stroke="#3B82F6" stroke-width="2"/>
  <text x="70" y="102" text-anchor="middle" class="label" font-weight="600">Source</text>
  <text x="70" y="120" text-anchor="middle" class="small" fill="#2563EB">Sender</text>

  <!-- Router 1 -->
  <circle cx="230" cy="105" r="26" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
  <text x="230" y="109" text-anchor="middle" class="label" font-weight="600">R1</text>

  <!-- Congested Router -->
  <circle cx="420" cy="105" r="30" fill="#FEE2E2" stroke="#DC2626" stroke-width="2.5"/>
  <text x="420" y="100" text-anchor="middle" class="label" fill="#DC2626" font-weight="700">R2</text>
  <text x="420" y="115" text-anchor="middle" class="small" fill="#DC2626">Congested!</text>

  <!-- Congestion indicator -->
  <rect x="395" y="62" width="50" height="18" rx="3" fill="#DC2626"/>
  <text x="420" y="74" text-anchor="middle" class="small" fill="#FFF" font-weight="600">⚠ 95%</text>

  <!-- Router 3 -->
  <circle cx="600" cy="105" r="26" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
  <text x="600" y="109" text-anchor="middle" class="label" font-weight="600">R3</text>

  <!-- Destination -->
  <rect x="690" y="80" width="80" height="50" rx="8" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
  <text x="730" y="102" text-anchor="middle" class="label" font-weight="600">Dest</text>
  <text x="730" y="120" text-anchor="middle" class="small" fill="#059669">Receiver</text>

  <!-- Forward data links -->
  <line x1="110" y1="105" x2="204" y2="105" stroke="#3B82F6" stroke-width="2" marker-end="url(#tB)"/>
  <line x1="256" y1="105" x2="390" y2="105" stroke="#3B82F6" stroke-width="2" marker-end="url(#tB)"/>
  <line x1="450" y1="105" x2="574" y2="105" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#tB)"/>
  <line x1="626" y1="105" x2="688" y2="105" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#tB)"/>

  <!-- Packets forward -->
  <rect x="140" y="98" width="14" height="10" rx="2" fill="#3B82F6"/>
  <rect x="160" y="98" width="14" height="10" rx="2" fill="#3B82F6"/>
  <rect x="280" y="98" width="14" height="10" rx="2" fill="#3B82F6"/>
  <rect x="300" y="98" width="14" height="10" rx="2" fill="#3B82F6"/>
  <rect x="320" y="98" width="14" height="10" rx="2" fill="#3B82F6"/>
  <rect x="340" y="98" width="14" height="10" rx="2" fill="#3B82F6"/>

  <!-- Step labels -->
  <!-- Step 1: Congestion detected -->
  <rect x="370" y="140" width="100" height="28" rx="4" fill="#FEF2F2" stroke="#DC2626" stroke-width="1"/>
  <text x="420" y="158" text-anchor="middle" class="step" fill="#DC2626">① Detect</text>

  <!-- Choke packet backward -->
  <path d="M400,140 Q400,170 350,175 Q200,185 100,170 Q70,165 70,140" fill="none" stroke="#EA580C" stroke-width="2.5" marker-end="url(#tO)"/>
  <rect x="230" y="168" width="90" height="22" rx="4" fill="#FFF7ED" stroke="#F97316" stroke-width="1.5"/>
  <text x="275" y="183" text-anchor="middle" class="small" fill="#EA580C" font-weight="600">② Choke Pkt ←</text>

  <!-- Step 3: Source reduces rate -->
  <rect x="30" y="140" width="80" height="22" rx="4" fill="#D1FAE5" stroke="#059669" stroke-width="1"/>
  <text x="70" y="155" text-anchor="middle" class="step" fill="#059669">③ Reduce</text>

  <!-- ===== TIMELINE (Bottom) ===== -->
  <rect x="30" y="210" width="740" height="275" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
  <text x="400" y="235" text-anchor="middle" class="label" font-weight="700">Sending Rate Over Time (Traffic Throttling Timeline)</text>

  <!-- Timeline axes -->
  <line x1="80" y1="440" x2="730" y2="440" stroke="#1E293B" stroke-width="1.5"/>
  <line x1="80" y1="440" x2="80" y2="260" stroke="#1E293B" stroke-width="1.5"/>

  <text x="400" y="465" text-anchor="middle" class="label">Time →</text>
  <text x="55" y="350" text-anchor="middle" class="label" transform="rotate(-90,55,350)">Sending Rate →</text>

  <!-- Rate levels -->
  <line x1="75" y1="285" x2="730" y2="285" stroke="#FCA5A5" stroke-width="0.5" stroke-dasharray="3,3"/>
  <text x="75" y="283" text-anchor="end" class="small" fill="#DC2626">Max</text>
  <line x1="75" y1="340" x2="730" y2="340" stroke="#FDBA74" stroke-width="0.5" stroke-dasharray="3,3"/>
  <text x="75" y="338" text-anchor="end" class="small" fill="#EA580C">Med</text>
  <line x1="75" y1="395" x2="730" y2="395" stroke="#86EFAC" stroke-width="0.5" stroke-dasharray="3,3"/>
  <text x="75" y="393" text-anchor="end" class="small" fill="#059669">Low</text>

  <!-- Phase 1: High rate sending -->
  <line x1="80" y1="290" x2="230" y2="280" stroke="#DC2626" stroke-width="3"/>
  <rect x="120" y="258" width="80" height="18" rx="3" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1"/>
  <text x="160" y="271" text-anchor="middle" class="small" fill="#DC2626" font-weight="600">High rate ↑</text>

  <!-- Congestion detected event -->
  <line x1="230" y1="260" x2="230" y2="440" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="4,3"/>
  <rect x="200" y="245" width="60" height="18" rx="3" fill="#DC2626"/>
  <text x="230" y="257" text-anchor="middle" class="small" fill="#FFF" font-weight="600">⚠ Alert</text>

  <!-- Choke received event -->
  <line x1="310" y1="260" x2="310" y2="440" stroke="#F97316" stroke-width="1.5" stroke-dasharray="4,3"/>
  <rect x="275" y="245" width="70" height="18" rx="3" fill="#F97316"/>
  <text x="310" y="257" text-anchor="middle" class="small" fill="#FFF" font-weight="600">Choke rcvd</text>

  <!-- Phase 2: Rate reduction -->
  <line x1="230" y1="280" x2="310" y2="280" stroke="#F97316" stroke-width="3"/>
  <line x1="310" y1="280" x2="340" y2="370" stroke="#F97316" stroke-width="3"/>
  <text x="350" y="330" class="small" fill="#EA580C" font-weight="600">Rate ↓</text>

  <!-- Phase 3: Low rate -->
  <line x1="340" y1="370" x2="460" y2="375" stroke="#059669" stroke-width="3"/>
  <rect x="360" y="353" width="80" height="18" rx="3" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1"/>
  <text x="400" y="366" text-anchor="middle" class="small" fill="#059669" font-weight="600">Reduced rate</text>

  <!-- Phase 4: Gradual recovery -->
  <line x1="460" y1="375" x2="550" y2="350" stroke="#3B82F6" stroke-width="3"/>
  <line x1="550" y1="350" x2="640" y2="330" stroke="#3B82F6" stroke-width="3"/>
  <line x1="640" y1="330" x2="720" y2="320" stroke="#3B82F6" stroke-width="3"/>
  <text x="600" y="320" text-anchor="middle" class="small" fill="#2563EB" font-weight="600">Gradual recovery ↑</text>

  <!-- Time labels -->
  <text x="150" y="455" text-anchor="middle" class="small">t₀</text>
  <text x="230" y="455" text-anchor="middle" class="small" fill="#DC2626">t₁ congestion</text>
  <text x="310" y="455" text-anchor="middle" class="small" fill="#F97316">t₂ choke</text>
  <text x="400" y="455" text-anchor="middle" class="small" fill="#059669">t₃ reduced</text>
  <text x="600" y="455" text-anchor="middle" class="small" fill="#2563EB">t₄ recovery</text>

  <!-- RTT annotation -->
  <line x1="230" y1="475" x2="310" y2="475" stroke="#94A3B8" stroke-width="1"/>
  <line x1="230" y1="472" x2="230" y2="478" stroke="#94A3B8" stroke-width="1"/>
  <line x1="310" y1="472" x2="310" y2="478" stroke="#94A3B8" stroke-width="1"/>
  <text x="270" y="488" text-anchor="middle" class="small">≈ 1 RTT delay</text>
</svg>