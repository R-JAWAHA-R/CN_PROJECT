<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <marker id="lB" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6Z" fill="#2563EB"/></marker>
    <marker id="lG" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6Z" fill="#059669"/></marker>
    <marker id="lR" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6Z" fill="#DC2626"/></marker>
  </defs>
  <style>
    text { font-family: 'Segoe UI', Arial, sans-serif; }
    .title { font-size: 18px; font-weight: 700; fill: #1E293B; }
    .subtitle { font-size: 12px; fill: #64748B; }
    .label { font-size: 11px; fill: #334155; }
    .small { font-size: 10px; fill: #64748B; }
  </style>
  <rect width="800" height="500" fill="#FFFFFF" rx="8"/>
  <text x="400" y="28" text-anchor="middle" class="title">Load Shedding — Dropping Packets Under Congestion</text>
  <text x="400" y="46" text-anchor="middle" class="subtitle">When buffers are full, the router must decide which packets to drop</text>

  <!-- ===== Congested Router (center top) ===== -->
  <rect x="275" y="60" width="250" height="70" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
  <text x="400" y="82" text-anchor="middle" class="label" font-weight="700" fill="#DC2626">🔴 Congested Router</text>
  <text x="400" y="100" text-anchor="middle" class="small">Buffer is FULL — incoming packets cannot be stored</text>
  <text x="400" y="115" text-anchor="middle" class="small" fill="#DC2626">Must shed (drop) some packets to cope</text>

  <!-- Incoming packets -->
  <rect x="60" y="80" width="14" height="10" rx="2" fill="#3B82F6"/>
  <rect x="80" y="80" width="14" height="10" rx="2" fill="#3B82F6"/>
  <rect x="100" y="80" width="14" height="10" rx="2" fill="#3B82F6"/>
  <rect x="120" y="80" width="14" height="10" rx="2" fill="#3B82F6"/>
  <rect x="140" y="80" width="14" height="10" rx="2" fill="#3B82F6"/>
  <rect x="160" y="80" width="14" height="10" rx="2" fill="#3B82F6"/>
  <rect x="180" y="80" width="14" height="10" rx="2" fill="#3B82F6"/>
  <rect x="200" y="80" width="14" height="10" rx="2" fill="#3B82F6"/>
  <rect x="220" y="80" width="14" height="10" rx="2" fill="#3B82F6"/>
  <rect x="240" y="80" width="14" height="10" rx="2" fill="#3B82F6"/>
  <line x1="254" y1="85" x2="273" y2="85" stroke="#3B82F6" stroke-width="2" marker-end="url(#lB)"/>
  <text x="155" y="75" text-anchor="middle" class="small" fill="#2563EB">Incoming packets →</text>

  <!-- ===== Policy 1: Random Drop (Left) ===== -->
  <rect x="25" y="155" width="360" height="310" rx="8" fill="#FFF7ED" stroke="#FDBA74" stroke-width="1.5"/>
  <text x="205" y="178" text-anchor="middle" class="label" font-weight="700" fill="#EA580C">Policy 1: Random Early Detection (RED)</text>
  <text x="205" y="195" text-anchor="middle" class="small">Randomly drop packets before buffer is completely full</text>

  <!-- Queue visualization -->
  <rect x="55" y="215" width="300" height="40" rx="5" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="205" y="208" text-anchor="middle" class="small" fill="#DC2626" font-weight="600">Router Queue (Near Full)</text>

  <!-- Packets in queue - some crossed out randomly -->
  <rect x="60" y="220" width="22" height="30" rx="3" fill="#3B82F6" opacity="0.8"/>
  <text x="71" y="239" text-anchor="middle" class="small" fill="#FFF">P1</text>

  <rect x="86" y="220" width="22" height="30" rx="3" fill="#3B82F6" opacity="0.8"/>
  <text x="97" y="239" text-anchor="middle" class="small" fill="#FFF">P2</text>

  <rect x="112" y="220" width="22" height="30" rx="3" fill="#FCA5A5" opacity="0.8" stroke="#DC2626" stroke-width="1.5"/>
  <text x="123" y="239" text-anchor="middle" class="small" fill="#DC2626">P3</text>
  <line x1="112" y1="220" x2="134" y2="250" stroke="#DC2626" stroke-width="2"/>
  <line x1="134" y1="220" x2="112" y2="250" stroke="#DC2626" stroke-width="2"/>

  <rect x="138" y="220" width="22" height="30" rx="3" fill="#3B82F6" opacity="0.8"/>
  <text x="149" y="239" text-anchor="middle" class="small" fill="#FFF">P4</text>

  <rect x="164" y="220" width="22" height="30" rx="3" fill="#3B82F6" opacity="0.8"/>
  <text x="175" y="239" text-anchor="middle" class="small" fill="#FFF">P5</text>

  <rect x="190" y="220" width="22" height="30" rx="3" fill="#FCA5A5" opacity="0.8" stroke="#DC2626" stroke-width="1.5"/>
  <text x="201" y="239" text-anchor="middle" class="small" fill="#DC2626">P6</text>
  <line x1="190" y1="220" x2="212" y2="250" stroke="#DC2626" stroke-width="2"/>
  <line x1="212" y1="220" x2="190" y2="250" stroke="#DC2626" stroke-width="2"/>

  <rect x="216" y="220" width="22" height="30" rx="3" fill="#3B82F6" opacity="0.8"/>
  <text x="227" y="239" text-anchor="middle" class="small" fill="#FFF">P7</text>

  <rect x="242" y="220" width="22" height="30" rx="3" fill="#3B82F6" opacity="0.8"/>
  <text x="253" y="239" text-anchor="middle" class="small" fill="#FFF">P8</text>

  <rect x="268" y="220" width="22" height="30" rx="3" fill="#FCA5A5" opacity="0.8" stroke="#DC2626" stroke-width="1.5"/>
  <text x="279" y="239" text-anchor="middle" class="small" fill="#DC2626">P9</text>
  <line x1="268" y1="220" x2="290" y2="250" stroke="#DC2626" stroke-width="2"/>
  <line x1="290" y1="220" x2="268" y2="250" stroke="#DC2626" stroke-width="2"/>

  <rect x="294" y="220" width="22" height="30" rx="3" fill="#3B82F6" opacity="0.8"/>
  <text x="305" y="239" text-anchor="middle" class="small" fill="#FFF">P10</text>

  <rect x="320" y="220" width="22" height="30" rx="3" fill="#3B82F6" opacity="0.8"/>
  <text x="331" y="239" text-anchor="middle" class="small" fill="#FFF">P11</text>

  <!-- Dropped packets falling -->
  <rect x="105" y="270" width="18" height="12" rx="2" fill="#FCA5A5" stroke="#DC2626" stroke-width="1" transform="rotate(20,114,276)"/>
  <rect x="185" y="275" width="18" height="12" rx="2" fill="#FCA5A5" stroke="#DC2626" stroke-width="1" transform="rotate(-15,194,281)"/>
  <rect x="265" y="268" width="18" height="12" rx="2" fill="#FCA5A5" stroke="#DC2626" stroke-width="1" transform="rotate(10,274,274)"/>
  <text x="205" y="300" text-anchor="middle" class="small" fill="#DC2626">🎲 Randomly selected packets dropped</text>

  <!-- Characteristics -->
  <rect x="45" y="315" width="320" height="130" rx="6" fill="#FFFFFF" stroke="#FDBA74" stroke-width="1"/>
  <text x="205" y="335" text-anchor="middle" class="label" font-weight="600" fill="#EA580C">Characteristics:</text>
  <text x="65" y="355" class="small">• No packet is safe — any can be dropped</text>
  <text x="65" y="372" class="small">• Fair across all flows (probabilistic)</text>
  <text x="65" y="389" class="small">• Drop probability increases with queue fill</text>
  <text x="65" y="406" class="small">• Simple to implement</text>
  <text x="65" y="423" class="small" fill="#EA580C">• Early drops signal senders to slow down</text>
  <text x="65" y="440" class="small" fill="#059669">• Prevents global synchronization</text>

  <!-- ===== Policy 2: Priority-Based Drop (Right) ===== -->
  <rect x="415" y="155" width="360" height="310" rx="8" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="595" y="178" text-anchor="middle" class="label" font-weight="700" fill="#2563EB">Policy 2: Priority-Based Dropping</text>
  <text x="595" y="195" text-anchor="middle" class="small">Low-priority packets dropped first; high-priority preserved</text>

  <!-- Queue visualization with priority colors -->
  <rect x="445" y="215" width="300" height="40" rx="5" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="595" y="208" text-anchor="middle" class="small" fill="#2563EB" font-weight="600">Router Queue (Priority Sorted)</text>

  <!-- High priority packets (green - kept) -->
  <rect x="450" y="220" width="22" height="30" rx="3" fill="#059669"/>
  <text x="461" y="239" text-anchor="middle" class="small" fill="#FFF">H1</text>
  <rect x="476" y="220" width="22" height="30" rx="3" fill="#059669"/>
  <text x="487" y="239" text-anchor="middle" class="small" fill="#FFF">H2</text>
  <rect x="502" y="220" width="22" height="30" rx="3" fill="#059669"/>
  <text x="513" y="239" text-anchor="middle" class="small" fill="#FFF">H3</text>
  <rect x="528" y="220" width="22" height="30" rx="3" fill="#059669"/>
  <text x="539" y="239" text-anchor="middle" class="small" fill="#FFF">H4</text>

  <!-- Medium priority (orange - maybe) -->
  <rect x="558" y="220" width="22" height="30" rx="3" fill="#F97316"/>
  <text x="569" y="239" text-anchor="middle" class="small" fill="#FFF">M1</text>
  <rect x="584" y="220" width="22" height="30" rx="3" fill="#F97316"/>
  <text x="595" y="239" text-anchor="middle" class="small" fill="#FFF">M2</text>
  <rect x="610" y="220" width="22" height="30" rx="3" fill="#F97316"/>
  <text x="621" y="239" text-anchor="middle" class="small" fill="#FFF">M3</text>

  <!-- Low priority (red/gray - dropped first) -->
  <rect x="640" y="220" width="22" height="30" rx="3" fill="#FCA5A5" stroke="#DC2626" stroke-width="1.5"/>
  <text x="651" y="239" text-anchor="middle" class="small" fill="#DC2626">L1</text>
  <line x1="640" y1="220" x2="662" y2="250" stroke="#DC2626" stroke-width="2"/>
  <line x1="662" y1="220" x2="640" y2="250" stroke="#DC2626" stroke-width="2"/>

  <rect x="666" y="220" width="22" height="30" rx="3" fill="#FCA5A5" stroke="#DC2626" stroke-width="1.5"/>
  <text x="677" y="239" text-anchor="middle" class="small" fill="#DC2626">L2</text>
  <line x1="666" y1="220" x2="688" y2="250" stroke="#DC2626" stroke-width="2"/>
  <line x1="688" y1="220" x2="666" y2="250" stroke="#DC2626" stroke-width="2"/>

  <rect x="692" y="220" width="22" height="30" rx="3" fill="#FCA5A5" stroke="#DC2626" stroke-width="1.5"/>
  <text x="703" y="239" text-anchor="middle" class="small" fill="#DC2626">L3</text>
  <line x1="692" y1="220" x2="714" y2="250" stroke="#DC2626" stroke-width="2"/>
  <line x1="714" y1="220" x2="692" y2="250" stroke="#DC2626" stroke-width="2"/>

  <!-- Drop order indicator -->
  <text x="677" y="270" text-anchor="middle" class="small" fill="#DC2626">← Dropped FIRST</text>
  <text x="490" y="270" text-anchor="middle" class="small" fill="#059669">Kept →</text>

  <!-- Priority legend -->
  <rect x="445" y="285" width="300" height="30" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
  <rect x="455" y="292" width="14" height="14" rx="2" fill="#059669"/>
  <text x="480" y="303" class="small" font-weight="600" fill="#059669">High</text>
  <rect x="520" y="292" width="14" height="14" rx="2" fill="#F97316"/>
  <text x="545" y="303" class="small" font-weight="600" fill="#EA580C">Medium</text>
  <rect x="585" y="292" width="14" height="14" rx="2" fill="#FCA5A5" stroke="#DC2626"/>
  <text x="610" y="303" class="small" font-weight="600" fill="#DC2626">Low</text>
  <text x="680" y="303" class="small" fill="#DC2626">← Drop first</text>

  <!-- Characteristics -->
  <rect x="435" y="325" width="320" height="120" rx="6" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1"/>
  <text x="595" y="345" text-anchor="middle" class="label" font-weight="600" fill="#2563EB">Characteristics:</text>
  <text x="455" y="365" class="small">• Critical traffic (VoIP, control) protected</text>
  <text x="455" y="382" class="small">• Best-effort traffic dropped first</text>
  <text x="455" y="399" class="small">• Requires packet classification</text>
  <text x="455" y="416" class="small" fill="#2563EB">• Ensures QoS for important flows</text>
  <text x="455" y="433" class="small" fill="#EA580C">• May starve low-priority flows</text>
</svg>