<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <marker id="arrowB" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6Z" fill="#2563EB"/></marker>
    <marker id="arrowR" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6Z" fill="#DC2626"/></marker>
    <linearGradient id="queueGrad" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#FEE2E2"/><stop offset="100%" stop-color="#FECACA"/></linearGradient>
  </defs>
  <style>
    text { font-family: 'Segoe UI', Arial, sans-serif; }
    .title { font-size: 18px; font-weight: 700; fill: #1E293B; }
    .subtitle { font-size: 13px; font-weight: 600; fill: #475569; }
    .label { font-size: 11px; fill: #334155; }
    .small { font-size: 10px; fill: #64748B; }
    .pkt { stroke-width: 1.5; }
  </style>
  <rect width="800" height="500" fill="#FFFFFF" rx="8"/>
  <text x="400" y="32" text-anchor="middle" class="title">Network Congestion — Concept &amp; Effects</text>

  <!-- BEFORE: Normal -->
  <rect x="20" y="50" width="370" height="200" rx="8" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.5"/>
  <text x="205" y="72" text-anchor="middle" class="subtitle" fill="#059669">✓ Normal Operation</text>

  <!-- Senders -->
  <rect x="40" y="95" width="50" height="30" rx="5" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="65" y="114" text-anchor="middle" class="label">S1</text>
  <rect x="40" y="140" width="50" height="30" rx="5" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="65" y="159" text-anchor="middle" class="label">S2</text>
  <rect x="40" y="185" width="50" height="30" rx="5" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="65" y="204" text-anchor="middle" class="label">S3</text>

  <!-- Router normal -->
  <circle cx="205" cy="155" r="28" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
  <text x="205" y="159" text-anchor="middle" class="label" font-weight="600">Router</text>

  <!-- Links to router -->
  <line x1="90" y1="110" x2="177" y2="145" stroke="#3B82F6" stroke-width="2" marker-end="url(#arrowB)"/>
  <line x1="90" y1="155" x2="177" y2="155" stroke="#3B82F6" stroke-width="2" marker-end="url(#arrowB)"/>
  <line x1="90" y1="200" x2="177" y2="165" stroke="#3B82F6" stroke-width="2" marker-end="url(#arrowB)"/>

  <!-- Packets flowing smoothly -->
  <rect x="120" y="103" width="14" height="10" rx="2" fill="#3B82F6" class="pkt" stroke="#2563EB"/>
  <rect x="130" y="148" width="14" height="10" rx="2" fill="#3B82F6" class="pkt" stroke="#2563EB"/>
  <rect x="122" y="188" width="14" height="10" rx="2" fill="#3B82F6" class="pkt" stroke="#2563EB"/>

  <!-- Receiver -->
  <rect x="310" y="140" width="55" height="30" rx="5" fill="#D1FAE5" stroke="#059669" stroke-width="1.5"/>
  <text x="337" y="159" text-anchor="middle" class="label">Dest</text>
  <line x1="233" y1="155" x2="308" y2="155" stroke="#059669" stroke-width="2" marker-end="url(#arrowB)"/>

  <!-- Smooth packets out -->
  <rect x="255" y="148" width="14" height="10" rx="2" fill="#10B981" class="pkt" stroke="#059669"/>
  <rect x="280" y="148" width="14" height="10" rx="2" fill="#10B981" class="pkt" stroke="#059669"/>

  <text x="205" y="240" text-anchor="middle" class="small">Packets flow smoothly, low delay</text>

  <!-- AFTER: Congested -->
  <rect x="410" y="50" width="370" height="200" rx="8" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1.5"/>
  <text x="595" y="72" text-anchor="middle" class="subtitle" fill="#DC2626">✗ Congested Network</text>

  <!-- Many senders -->
  <rect x="425" y="82" width="42" height="24" rx="4" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1.2"/>
  <text x="446" y="98" text-anchor="middle" class="small">S1</text>
  <rect x="425" y="112" width="42" height="24" rx="4" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1.2"/>
  <text x="446" y="128" text-anchor="middle" class="small">S2</text>
  <rect x="425" y="142" width="42" height="24" rx="4" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1.2"/>
  <text x="446" y="158" text-anchor="middle" class="small">S3</text>
  <rect x="425" y="172" width="42" height="24" rx="4" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1.2"/>
  <text x="446" y="188" text-anchor="middle" class="small">S4</text>
  <rect x="425" y="202" width="42" height="24" rx="4" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1.2"/>
  <text x="446" y="218" text-anchor="middle" class="small">S5</text>

  <!-- Links to congested router -->
  <line x1="467" y1="94" x2="547" y2="140" stroke="#DC2626" stroke-width="1.5"/>
  <line x1="467" y1="124" x2="547" y2="145" stroke="#DC2626" stroke-width="1.5"/>
  <line x1="467" y1="154" x2="547" y2="155" stroke="#DC2626" stroke-width="1.5"/>
  <line x1="467" y1="184" x2="547" y2="165" stroke="#DC2626" stroke-width="1.5"/>
  <line x1="467" y1="214" x2="547" y2="170" stroke="#DC2626" stroke-width="1.5"/>

  <!-- Congested router -->
  <circle cx="575" cy="155" r="28" fill="#FEE2E2" stroke="#DC2626" stroke-width="2.5"/>
  <text x="575" y="152" text-anchor="middle" class="label" fill="#DC2626" font-weight="700">Router</text>
  <text x="575" y="165" text-anchor="middle" class="small" fill="#DC2626">FULL</text>

  <!-- Bottleneck queue -->
  <rect x="530" y="100" width="90" height="16" rx="3" fill="url(#queueGrad)" stroke="#DC2626" stroke-width="1"/>
  <text x="575" y="98" text-anchor="middle" class="small" fill="#DC2626">Queue overflow!</text>
  <!-- Queue packets -->
  <rect x="532" y="102" width="10" height="12" rx="1" fill="#F87171"/>
  <rect x="544" y="102" width="10" height="12" rx="1" fill="#F87171"/>
  <rect x="556" y="102" width="10" height="12" rx="1" fill="#F87171"/>
  <rect x="568" y="102" width="10" height="12" rx="1" fill="#F87171"/>
  <rect x="580" y="102" width="10" height="12" rx="1" fill="#F87171"/>
  <rect x="592" y="102" width="10" height="12" rx="1" fill="#EF4444"/>
  <rect x="604" y="102" width="10" height="12" rx="1" fill="#EF4444"/>

  <!-- Dropped packets -->
  <rect x="590" y="185" width="12" height="8" rx="1" fill="#FCA5A5" stroke="#DC2626" stroke-width="0.8" transform="rotate(25,596,189)"/>
  <rect x="610" y="195" width="12" height="8" rx="1" fill="#FCA5A5" stroke="#DC2626" stroke-width="0.8" transform="rotate(-15,616,199)"/>
  <text x="625" y="210" class="small" fill="#DC2626">Dropped!</text>

  <!-- Thin output link -->
  <rect x="700" y="140" width="55" height="30" rx="5" fill="#D1FAE5" stroke="#059669" stroke-width="1.5"/>
  <text x="727" y="159" text-anchor="middle" class="label">Dest</text>
  <line x1="603" y1="155" x2="698" y2="155" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowR)"/>
  <rect x="640" y="148" width="12" height="10" rx="2" fill="#10B981" class="pkt" stroke="#059669" opacity="0.5"/>
  <text x="650" y="175" text-anchor="middle" class="small" fill="#DC2626">Few get through</text>

  <text x="595" y="240" text-anchor="middle" class="small">Too many packets → queue overflow → drops &amp; delay</text>

  <!-- Effects Section -->
  <rect x="20" y="270" width="760" height="210" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
  <text x="400" y="295" text-anchor="middle" class="subtitle">Effects of Congestion</text>

  <!-- Effect 1: Increased Delay -->
  <rect x="45" y="315" width="220" height="145" rx="8" fill="#FFF7ED" stroke="#FDBA74" stroke-width="1.5"/>
  <text x="155" y="340" text-anchor="middle" class="label" font-weight="600" fill="#EA580C">⏱ Increased Delay</text>
  <!-- Timeline -->
  <line x1="70" y1="370" x2="240" y2="370" stroke="#EA580C" stroke-width="1.5"/>
  <text x="80" y="365" class="small">Send</text>
  <text x="220" y="365" class="small">Arrive</text>
  <!-- Normal delay -->
  <line x1="80" y1="385" x2="160" y2="385" stroke="#10B981" stroke-width="3"/>
  <circle cx="80" cy="385" r="3" fill="#10B981"/>
  <circle cx="160" cy="385" r="3" fill="#10B981"/>
  <text x="120" y="400" text-anchor="middle" class="small" fill="#059669">Normal</text>
  <!-- Congested delay -->
  <line x1="80" y1="420" x2="235" y2="420" stroke="#DC2626" stroke-width="3"/>
  <circle cx="80" cy="420" r="3" fill="#DC2626"/>
  <circle cx="235" cy="420" r="3" fill="#DC2626"/>
  <text x="158" y="435" text-anchor="middle" class="small" fill="#DC2626">Congested (much longer!)</text>

  <!-- Effect 2: Packet Loss -->
  <rect x="290" y="315" width="220" height="145" rx="8" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1.5"/>
  <text x="400" y="340" text-anchor="middle" class="label" font-weight="600" fill="#DC2626">📦 Packet Loss</text>
  <!-- Buffer visualization -->
  <rect x="320" y="360" width="160" height="25" rx="4" fill="#FEE2E2" stroke="#DC2626" stroke-width="1"/>
  <text x="400" y="377" text-anchor="middle" class="small" fill="#DC2626">Router Buffer (FULL)</text>
  <rect x="322" y="362" width="18" height="21" rx="2" fill="#F87171" opacity="0.8"/>
  <rect x="342" y="362" width="18" height="21" rx="2" fill="#F87171" opacity="0.8"/>
  <rect x="362" y="362" width="18" height="21" rx="2" fill="#F87171" opacity="0.8"/>
  <rect x="382" y="362" width="18" height="21" rx="2" fill="#F87171" opacity="0.8"/>
  <rect x="402" y="362" width="18" height="21" rx="2" fill="#F87171" opacity="0.8"/>
  <rect x="422" y="362" width="18" height="21" rx="2" fill="#F87171" opacity="0.8"/>
  <rect x="442" y="362" width="18" height="21" rx="2" fill="#F87171" opacity="0.8"/>
  <rect x="462" y="362" width="18" height="21" rx="2" fill="#F87171" opacity="0.8"/>
  <!-- New packet rejected -->
  <rect x="370" y="400" width="18" height="12" rx="2" fill="#3B82F6" stroke="#2563EB" stroke-width="1"/>
  <text x="395" y="410" class="small" fill="#DC2626">← New pkt</text>
  <text x="350" y="430" class="small" fill="#DC2626">✗ DROPPED</text>
  <text x="400" y="450" text-anchor="middle" class="small">Buffer full → new packets discarded</text>

  <!-- Effect 3: Retransmission Waste -->
  <rect x="535" y="315" width="220" height="145" rx="8" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="645" y="340" text-anchor="middle" class="label" font-weight="600" fill="#2563EB">🔄 Retransmission Waste</text>
  <!-- Cycle -->
  <text x="570" y="370" class="small" fill="#2563EB">1. Packet sent</text>
  <text x="570" y="387" class="small" fill="#DC2626">2. Packet dropped (congestion)</text>
  <text x="570" y="404" class="small" fill="#EA580C">3. Timeout → Retransmit</text>
  <text x="570" y="421" class="small" fill="#DC2626">4. More load → More congestion!</text>
  <!-- Spiral arrow -->
  <path d="M600,438 Q640,445 660,438 Q680,430 670,420" fill="none" stroke="#DC2626" stroke-width="1.5" marker-end="url(#arrowR)"/>
  <text x="645" y="455" text-anchor="middle" class="small" fill="#DC2626" font-weight="600">Vicious cycle!</text>
</svg>