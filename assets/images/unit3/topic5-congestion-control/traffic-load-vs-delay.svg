<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <marker id="axArr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6Z" fill="#1E293B"/></marker>
    <linearGradient id="idealGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: 'Segoe UI', Arial, sans-serif; }
    .title { font-size: 18px; font-weight: 700; fill: #1E293B; }
    .subtitle { font-size: 12px; fill: #64748B; }
    .axisLabel { font-size: 13px; font-weight: 600; fill: #334155; }
    .label { font-size: 11px; fill: #334155; }
    .small { font-size: 10px; fill: #64748B; }
    .tick { font-size: 9px; fill: #94A3B8; }
  </style>
  <rect width="800" height="500" fill="#FFFFFF" rx="8"/>
  <text x="400" y="30" text-anchor="middle" class="title">Offered Load vs. Throughput / Delay</text>
  <text x="400" y="48" text-anchor="middle" class="subtitle">Classic congestion behavior curve showing knee and cliff points</text>

  <!-- ===== THROUGHPUT GRAPH (Left) ===== -->
  <text x="220" y="75" text-anchor="middle" class="axisLabel" fill="#2563EB">Throughput vs. Offered Load</text>

  <!-- Axes -->
  <line x1="80" y1="380" x2="380" y2="380" stroke="#1E293B" stroke-width="1.5" marker-end="url(#axArr)"/>
  <line x1="80" y1="380" x2="80" y2="85" stroke="#1E293B" stroke-width="1.5" marker-end="url(#axArr)"/>

  <!-- Axis labels -->
  <text x="230" y="410" text-anchor="middle" class="axisLabel">Offered Load →</text>
  <text x="42" y="235" text-anchor="middle" class="axisLabel" transform="rotate(-90,42,235)">Throughput →</text>

  <!-- Grid lines -->
  <line x1="80" y1="310" x2="370" y2="310" stroke="#E2E8F0" stroke-width="0.5"/>
  <line x1="80" y1="240" x2="370" y2="240" stroke="#E2E8F0" stroke-width="0.5"/>
  <line x1="80" y1="170" x2="370" y2="170" stroke="#E2E8F0" stroke-width="0.5"/>
  <line x1="160" y1="90" x2="160" y2="380" stroke="#E2E8F0" stroke-width="0.5"/>
  <line x1="240" y1="90" x2="240" y2="380" stroke="#E2E8F0" stroke-width="0.5"/>
  <line x1="320" y1="90" x2="320" y2="380" stroke="#E2E8F0" stroke-width="0.5"/>

  <!-- Ideal line (diagonal then flat) -->
  <line x1="80" y1="380" x2="240" y2="170" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6,3"/>
  <line x1="240" y1="170" x2="380" y2="170" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="355" y="163" class="tick" fill="#94A3B8">Ideal</text>

  <!-- Actual throughput curve -->
  <path d="M80,380 Q130,330 170,270 Q200,210 230,180 Q260,165 290,160 Q320,162 340,175 Q360,195 370,220" 
        fill="none" stroke="#2563EB" stroke-width="3"/>

  <!-- Capacity line -->
  <line x1="75" y1="170" x2="80" y2="170" stroke="#059669" stroke-width="2"/>
  <text x="73" y="173" text-anchor="end" class="tick" fill="#059669">Capacity</text>

  <!-- Knee point -->
  <circle cx="230" cy="180" r="6" fill="#F97316" stroke="#EA580C" stroke-width="2"/>
  <line x1="230" y1="186" x2="230" y2="380" stroke="#EA580C" stroke-width="1" stroke-dasharray="3,3"/>
  <rect x="180" y="190" width="100" height="35" rx="4" fill="#FFF7ED" stroke="#FDBA74" stroke-width="1"/>
  <text x="230" y="206" text-anchor="middle" class="label" fill="#EA580C" font-weight="600">🦵 KNEE</text>
  <text x="230" y="219" text-anchor="middle" class="small" fill="#EA580C">Optimal point</text>

  <!-- Cliff point -->
  <circle cx="320" cy="165" r="6" fill="#DC2626" stroke="#B91C1C" stroke-width="2"/>
  <line x1="320" y1="171" x2="320" y2="380" stroke="#DC2626" stroke-width="1" stroke-dasharray="3,3"/>
  <rect x="278" y="124" width="84" height="35" rx="4" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1"/>
  <text x="320" y="140" text-anchor="middle" class="label" fill="#DC2626" font-weight="600">🧗 CLIFF</text>
  <text x="320" y="153" text-anchor="middle" class="small" fill="#DC2626">Collapse begins</text>

  <!-- Congestion collapse region -->
  <rect x="322" y="165" width="55" height="60" rx="0" fill="#FEE2E2" opacity="0.3"/>
  <text x="350" y="235" text-anchor="middle" class="small" fill="#DC2626" font-weight="600">Collapse!</text>

  <!-- Regions labels at bottom -->
  <text x="140" y="398" text-anchor="middle" class="tick" fill="#059669">Light load</text>
  <text x="270" y="398" text-anchor="middle" class="tick" fill="#F97316">Moderate</text>
  <text x="350" y="398" text-anchor="middle" class="tick" fill="#DC2626">Heavy</text>


  <!-- ===== DELAY GRAPH (Right) ===== -->
  <text x="600" y="75" text-anchor="middle" class="axisLabel" fill="#DC2626">Delay vs. Offered Load</text>

  <!-- Axes -->
  <line x1="460" y1="380" x2="760" y2="380" stroke="#1E293B" stroke-width="1.5" marker-end="url(#axArr)"/>
  <line x1="460" y1="380" x2="460" y2="85" stroke="#1E293B" stroke-width="1.5" marker-end="url(#axArr)"/>

  <!-- Axis labels -->
  <text x="610" y="410" text-anchor="middle" class="axisLabel">Offered Load →</text>
  <text x="425" y="235" text-anchor="middle" class="axisLabel" transform="rotate(-90,425,235)">Delay →</text>

  <!-- Grid lines -->
  <line x1="460" y1="310" x2="750" y2="310" stroke="#E2E8F0" stroke-width="0.5"/>
  <line x1="460" y1="240" x2="750" y2="240" stroke="#E2E8F0" stroke-width="0.5"/>
  <line x1="460" y1="170" x2="750" y2="170" stroke="#E2E8F0" stroke-width="0.5"/>
  <line x1="540" y1="90" x2="540" y2="380" stroke="#E2E8F0" stroke-width="0.5"/>
  <line x1="620" y1="90" x2="620" y2="380" stroke="#E2E8F0" stroke-width="0.5"/>
  <line x1="700" y1="90" x2="700" y2="380" stroke="#E2E8F0" stroke-width="0.5"/>

  <!-- Delay curve (exponential increase) -->
  <path d="M460,370 Q500,365 540,355 Q570,340 600,320 Q620,295 640,250 Q660,195 680,140 Q695,110 710,95" 
        fill="none" stroke="#DC2626" stroke-width="3"/>

  <!-- Knee point on delay -->
  <circle cx="610" cy="310" r="6" fill="#F97316" stroke="#EA580C" stroke-width="2"/>
  <line x1="610" y1="316" x2="610" y2="380" stroke="#EA580C" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="610" y="333" text-anchor="middle" class="small" fill="#EA580C" font-weight="600">KNEE</text>
  <text x="610" y="345" text-anchor="middle" class="small" fill="#EA580C">Delay starts ↑</text>

  <!-- Cliff point on delay -->
  <circle cx="680" cy="140" r="6" fill="#DC2626" stroke="#B91C1C" stroke-width="2"/>
  <text x="695" y="133" class="small" fill="#DC2626" font-weight="600">CLIFF</text>
  <text x="715" y="146" class="small" fill="#DC2626">Delay → ∞</text>

  <!-- Shaded danger zone -->
  <path d="M650,380 L650,210 Q670,155 690,120 Q700,105 710,95 L710,380 Z" fill="#FEE2E2" opacity="0.3"/>

  <!-- Regions at bottom -->
  <text x="520" y="398" text-anchor="middle" class="tick" fill="#059669">Low delay</text>
  <text x="635" y="398" text-anchor="middle" class="tick" fill="#F97316">Rising</text>
  <text x="710" y="398" text-anchor="middle" class="tick" fill="#DC2626">Extreme</text>

  <!-- Legend -->
  <rect x="240" y="430" width="320" height="55" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
  <text x="400" y="448" text-anchor="middle" class="label" font-weight="600">Key Insight</text>
  <text x="400" y="463" text-anchor="middle" class="small">Operate near the KNEE: good throughput, acceptable delay</text>
  <text x="400" y="478" text-anchor="middle" class="small" fill="#DC2626">Beyond the CLIFF: throughput drops, delay explodes → congestion collapse</text>
</svg>