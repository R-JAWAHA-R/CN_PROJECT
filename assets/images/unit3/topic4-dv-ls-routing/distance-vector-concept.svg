<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 520">
  <defs>
    <style>
      text { font-family: 'Segoe UI', Arial, sans-serif; }
      .title { font-size: 18px; font-weight: bold; fill: #1e293b; }
      .subtitle { font-size: 11px; fill: #64748b; }
      .router-label { font-size: 14px; font-weight: bold; fill: #fff; }
      .table-header { font-size: 9px; font-weight: bold; fill: #fff; }
      .table-cell { font-size: 8.5px; fill: #334155; }
      .link-cost { font-size: 11px; font-weight: bold; fill: #EA580C; }
      .arrow-label { font-size: 9px; fill: #2563EB; font-style: italic; }
      .note { font-size: 10px; fill: #64748b; }
    </style>
    <marker id="arrowBlue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#3B82F6"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="850" height="520" fill="#f8fafc" rx="8"/>
  
  <!-- Title -->
  <text x="425" y="32" text-anchor="middle" class="title">Distance Vector Routing – Concept</text>
  <text x="425" y="50" text-anchor="middle" class="subtitle">Each router shares its routing table only with directly connected neighbors</text>

  <!-- Links between routers -->
  <line x1="180" y1="150" x2="430" y2="110" stroke="#cbd5e1" stroke-width="3"/>
  <text x="300" y="118" class="link-cost">cost 2</text>
  
  <line x1="180" y1="150" x2="230" y2="340" stroke="#cbd5e1" stroke-width="3"/>
  <text x="178" y="250" class="link-cost">cost 1</text>

  <line x1="430" y1="110" x2="670" y2="150" stroke="#cbd5e1" stroke-width="3"/>
  <text x="555" y="118" class="link-cost">cost 3</text>

  <line x1="430" y1="110" x2="230" y2="340" stroke="#cbd5e1" stroke-width="3"/>
  <text x="310" y="240" class="link-cost">cost 4</text>

  <line x1="230" y1="340" x2="670" y2="150" stroke="#cbd5e1" stroke-width="3"/>
  <text x="470" y="260" class="link-cost">cost 5</text>

  <!-- DV Exchange Arrows -->
  <path d="M 205,145 C 290,80 340,80 410,108" stroke="#3B82F6" stroke-width="1.8" fill="none" stroke-dasharray="5,3" marker-end="url(#arrowBlue)"/>
  <text x="290" y="82" class="arrow-label">sends DV</text>

  <path d="M 410,118 C 340,100 290,100 205,155" stroke="#3B82F6" stroke-width="1.8" fill="none" stroke-dasharray="5,3" marker-end="url(#arrowBlue)"/>

  <path d="M 455,108 C 530,70 590,70 650,145" stroke="#3B82F6" stroke-width="1.8" fill="none" stroke-dasharray="5,3" marker-end="url(#arrowBlue)"/>
  <text x="545" y="72" class="arrow-label">sends DV</text>

  <path d="M 175,170 C 160,240 190,290 220,320" stroke="#3B82F6" stroke-width="1.8" fill="none" stroke-dasharray="5,3" marker-end="url(#arrowBlue)"/>
  <text x="148" y="275" class="arrow-label" transform="rotate(-70,148,275)">sends DV</text>

  <!-- Router A -->
  <circle cx="180" cy="150" r="24" fill="#2563EB" filter="url(#shadow)"/>
  <text x="180" y="155" text-anchor="middle" class="router-label">A</text>

  <!-- Router B -->
  <circle cx="430" cy="110" r="24" fill="#2563EB" filter="url(#shadow)"/>
  <text x="430" y="115" text-anchor="middle" class="router-label">B</text>

  <!-- Router C -->
  <circle cx="670" cy="150" r="24" fill="#2563EB" filter="url(#shadow)"/>
  <text x="670" y="155" text-anchor="middle" class="router-label">C</text>

  <!-- Router D -->
  <circle cx="230" cy="340" r="24" fill="#2563EB" filter="url(#shadow)"/>
  <text x="230" y="345" text-anchor="middle" class="router-label">D</text>

  <!-- Routing Table A -->
  <g transform="translate(30, 370)" filter="url(#shadow)">
    <rect width="155" height="22" fill="#2563EB" rx="4 4 0 0"/>
    <text x="78" y="15" text-anchor="middle" class="table-header">Router A's Table</text>
    <rect y="22" width="55" height="16" fill="#dbeafe" stroke="#bfdbfe"/>
    <rect x="55" y="22" width="50" height="16" fill="#dbeafe" stroke="#bfdbfe"/>
    <rect x="105" y="22" width="50" height="16" fill="#dbeafe" stroke="#bfdbfe"/>
    <text x="28" y="34" text-anchor="middle" style="font-size:8px;font-weight:bold;fill:#1e40af;">Dest</text>
    <text x="80" y="34" text-anchor="middle" style="font-size:8px;font-weight:bold;fill:#1e40af;">Dist</text>
    <text x="130" y="34" text-anchor="middle" style="font-size:8px;font-weight:bold;fill:#1e40af;">Next</text>
    <!-- Rows -->
    <rect y="38" width="55" height="16" fill="#fff" stroke="#e2e8f0"/>
    <rect x="55" y="38" width="50" height="16" fill="#fff" stroke="#e2e8f0"/>
    <rect x="105" y="38" width="50" height="16" fill="#fff" stroke="#e2e8f0"/>
    <text x="28" y="50" text-anchor="middle" class="table-cell">B</text>
    <text x="80" y="50" text-anchor="middle" class="table-cell">2</text>
    <text x="130" y="50" text-anchor="middle" class="table-cell">B</text>

    <rect y="54" width="55" height="16" fill="#f8fafc" stroke="#e2e8f0"/>
    <rect x="55" y="54" width="50" height="16" fill="#f8fafc" stroke="#e2e8f0"/>
    <rect x="105" y="54" width="50" height="16" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="28" y="66" text-anchor="middle" class="table-cell">C</text>
    <text x="80" y="66" text-anchor="middle" class="table-cell">5</text>
    <text x="130" y="66" text-anchor="middle" class="table-cell">B</text>

    <rect y="70" width="55" height="16" fill="#fff" stroke="#e2e8f0"/>
    <rect x="55" y="70" width="50" height="16" fill="#fff" stroke="#e2e8f0"/>
    <rect x="105" y="70" width="50" height="16" fill="#fff" stroke="#e2e8f0"/>
    <text x="28" y="82" text-anchor="middle" class="table-cell">D</text>
    <text x="80" y="82" text-anchor="middle" class="table-cell">1</text>
    <text x="130" y="82" text-anchor="middle" class="table-cell">D</text>
  </g>

  <!-- Routing Table B -->
  <g transform="translate(350, 370)" filter="url(#shadow)">
    <rect width="155" height="22" fill="#2563EB" rx="4 4 0 0"/>
    <text x="78" y="15" text-anchor="middle" class="table-header">Router B's Table</text>
    <rect y="22" width="55" height="16" fill="#dbeafe" stroke="#bfdbfe"/>
    <rect x="55" y="22" width="50" height="16" fill="#dbeafe" stroke="#bfdbfe"/>
    <rect x="105" y="22" width="50" height="16" fill="#dbeafe" stroke="#bfdbfe"/>
    <text x="28" y="34" text-anchor="middle" style="font-size:8px;font-weight:bold;fill:#1e40af;">Dest</text>
    <text x="80" y="34" text-anchor="middle" style="font-size:8px;font-weight:bold;fill:#1e40af;">Dist</text>
    <text x="130" y="34" text-anchor="middle" style="font-size:8px;font-weight:bold;fill:#1e40af;">Next</text>
    <rect y="38" width="55" height="16" fill="#fff" stroke="#e2e8f0"/>
    <rect x="55" y="38" width="50" height="16" fill="#fff" stroke="#e2e8f0"/>
    <rect x="105" y="38" width="50" height="16" fill="#fff" stroke="#e2e8f0"/>
    <text x="28" y="50" text-anchor="middle" class="table-cell">A</text>
    <text x="80" y="50" text-anchor="middle" class="table-cell">2</text>
    <text x="130" y="50" text-anchor="middle" class="table-cell">A</text>

    <rect y="54" width="55" height="16" fill="#f8fafc" stroke="#e2e8f0"/>
    <rect x="55" y="54" width="50" height="16" fill="#f8fafc" stroke="#e2e8f0"/>
    <rect x="105" y="54" width="50" height="16" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="28" y="66" text-anchor="middle" class="table-cell">C</text>
    <text x="80" y="66" text-anchor="middle" class="table-cell">3</text>
    <text x="130" y="66" text-anchor="middle" class="table-cell">C</text>

    <rect y="70" width="55" height="16" fill="#fff" stroke="#e2e8f0"/>
    <rect x="55" y="70" width="50" height="16" fill="#fff" stroke="#e2e8f0"/>
    <rect x="105" y="70" width="50" height="16" fill="#fff" stroke="#e2e8f0"/>
    <text x="28" y="82" text-anchor="middle" class="table-cell">D</text>
    <text x="80" y="82" text-anchor="middle" class="table-cell">4</text>
    <text x="130" y="82" text-anchor="middle" class="table-cell">D</text>
  </g>

  <!-- Routing Table C -->
  <g transform="translate(660, 370)" filter="url(#shadow)">
    <rect width="155" height="22" fill="#2563EB" rx="4 4 0 0"/>
    <text x="78" y="15" text-anchor="middle" class="table-header">Router C's Table</text>
    <rect y="22" width="55" height="16" fill="#dbeafe" stroke="#bfdbfe"/>
    <rect x="55" y="22" width="50" height="16" fill="#dbeafe" stroke="#bfdbfe"/>
    <rect x="105" y="22" width="50" height="16" fill="#dbeafe" stroke="#bfdbfe"/>
    <text x="28" y="34" text-anchor="middle" style="font-size:8px;font-weight:bold;fill:#1e40af;">Dest</text>
    <text x="80" y="34" text-anchor="middle" style="font-size:8px;font-weight:bold;fill:#1e40af;">Dist</text>
    <text x="130" y="34" text-anchor="middle" style="font-size:8px;font-weight:bold;fill:#1e40af;">Next</text>
    <rect y="38" width="55" height="16" fill="#fff" stroke="#e2e8f0"/>
    <rect x="55" y="38" width="50" height="16" fill="#fff" stroke="#e2e8f0"/>
    <rect x="105" y="38" width="50" height="16" fill="#fff" stroke="#e2e8f0"/>
    <text x="28" y="50" text-anchor="middle" class="table-cell">A</text>
    <text x="80" y="50" text-anchor="middle" class="table-cell">5</text>
    <text x="130" y="50" text-anchor="middle" class="table-cell">B</text>

    <rect y="54" width="55" height="16" fill="#f8fafc" stroke="#e2e8f0"/>
    <rect x="55" y="54" width="50" height="16" fill="#f8fafc" stroke="#e2e8f0"/>
    <rect x="105" y="54" width="50" height="16" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="28" y="66" text-anchor="middle" class="table-cell">B</text>
    <text x="80" y="66" text-anchor="middle" class="table-cell">3</text>
    <text x="130" y="66" text-anchor="middle" class="table-cell">B</text>

    <rect y="70" width="55" height="16" fill="#fff" stroke="#e2e8f0"/>
    <rect x="55" y="70" width="50" height="16" fill="#fff" stroke="#e2e8f0"/>
    <rect x="105" y="70" width="50" height="16" fill="#fff" stroke="#e2e8f0"/>
    <text x="28" y="82" text-anchor="middle" class="table-cell">D</text>
    <text x="80" y="82" text-anchor="middle" class="table-cell">5</text>
    <text x="130" y="82" text-anchor="middle" class="table-cell">D</text>
  </g>

  <!-- Key insight box -->
  <rect x="210" y="465" width="440" height="40" rx="6" fill="#eff6ff" stroke="#3B82F6" stroke-width="1.2"/>
  <text x="430" y="483" text-anchor="middle" style="font-size:10px;font-weight:bold;fill:#1e40af;">Key Principle:</text>
  <text x="430" y="498" text-anchor="middle" class="note">"Tell your neighbors about the whole world" — each router shares its full distance vector</text>
</svg>