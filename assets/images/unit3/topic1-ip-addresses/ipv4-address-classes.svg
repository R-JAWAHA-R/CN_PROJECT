<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 550">
  <defs>
    <style>
      text { font-family: 'Segoe UI', Arial, sans-serif; }
      .title { font-size: 20px; font-weight: bold; fill: #1e293b; }
      .subtitle { font-size: 12px; fill: #475569; }
      .class-label { font-size: 14px; fill: #ffffff; font-weight: bold; }
      .range-text { font-size: 10px; fill: #334155; }
      .bit-text { font-size: 9px; fill: #ffffff; font-weight: 600; text-anchor: middle; }
      .header-text { font-size: 11px; fill: #475569; font-weight: 600; text-anchor: middle; }
      .purpose-text { font-size: 10px; fill: #64748b; font-style: italic; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="850" height="550" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Title -->
  <text x="425" y="35" text-anchor="middle" class="title">IPv4 Address Classes (Classful Addressing)</text>
  <text x="425" y="55" text-anchor="middle" class="subtitle">Five classes (A–E) defined by the leading bits of the first octet</text>

  <!-- Column headers -->
  <text x="65" y="85" class="header-text">Class</text>
  <text x="150" y="85" class="header-text">Leading Bits</text>
  <text x="430" y="85" class="header-text">Network / Host Portions (32 bits)</text>
  <text x="720" y="85" class="header-text">Range</text>
  <line x1="30" y1="92" x2="820" y2="92" stroke="#e2e8f0" stroke-width="1"/>

  <!-- ======= CLASS A ======= -->
  <g transform="translate(0, 100)">
    <!-- Class badge -->
    <rect x="40" y="5" width="50" height="50" rx="25" fill="#2563EB"/>
    <text x="65" y="36" text-anchor="middle" class="class-label">A</text>

    <!-- Leading bit -->
    <rect x="115" y="15" width="25" height="28" rx="3" fill="#1e293b"/>
    <text x="127" y="34" class="bit-text">0</text>

    <!-- Network portion (8 bits) -->
    <rect x="200" y="10" width="80" height="38" rx="4" fill="#2563EB"/>
    <text x="240" y="28" class="bit-text" font-size="10">Network</text>
    <text x="240" y="40" class="bit-text" font-size="8">8 bits</text>

    <!-- Host portion (24 bits) -->
    <rect x="284" y="10" width="270" height="38" rx="4" fill="#F97316"/>
    <text x="419" y="28" class="bit-text" font-size="10">Host</text>
    <text x="419" y="40" class="bit-text" font-size="8">24 bits</text>

    <!-- Range -->
    <text x="620" y="28" class="range-text" font-weight="600">1.0.0.0 –</text>
    <text x="620" y="42" class="range-text">126.255.255.255</text>

    <!-- Purpose -->
    <text x="785" y="35" text-anchor="middle" class="purpose-text" font-size="9">Large networks</text>
  </g>

  <!-- ======= CLASS B ======= -->
  <g transform="translate(0, 180)">
    <rect x="40" y="5" width="50" height="50" rx="25" fill="#3B82F6"/>
    <text x="65" y="36" text-anchor="middle" class="class-label">B</text>

    <!-- Leading bits -->
    <rect x="110" y="15" width="25" height="28" rx="3" fill="#1e293b"/>
    <text x="122" y="34" class="bit-text">1</text>
    <rect x="137" y="15" width="25" height="28" rx="3" fill="#64748b"/>
    <text x="149" y="34" class="bit-text">0</text>

    <!-- Network (16 bits) -->
    <rect x="200" y="10" width="160" height="38" rx="4" fill="#3B82F6"/>
    <text x="280" y="28" class="bit-text" font-size="10">Network</text>
    <text x="280" y="40" class="bit-text" font-size="8">16 bits</text>

    <!-- Host (16 bits) -->
    <rect x="364" y="10" width="190" height="38" rx="4" fill="#F97316"/>
    <text x="459" y="28" class="bit-text" font-size="10">Host</text>
    <text x="459" y="40" class="bit-text" font-size="8">16 bits</text>

    <text x="620" y="28" class="range-text" font-weight="600">128.0.0.0 –</text>
    <text x="620" y="42" class="range-text">191.255.255.255</text>

    <text x="785" y="35" text-anchor="middle" class="purpose-text" font-size="9">Medium networks</text>
  </g>

  <!-- ======= CLASS C ======= -->
  <g transform="translate(0, 260)">
    <rect x="40" y="5" width="50" height="50" rx="25" fill="#059669"/>
    <text x="65" y="36" text-anchor="middle" class="class-label">C</text>

    <!-- Leading bits -->
    <rect x="105" y="15" width="25" height="28" rx="3" fill="#1e293b"/>
    <text x="117" y="34" class="bit-text">1</text>
    <rect x="132" y="15" width="25" height="28" rx="3" fill="#1e293b"/>
    <text x="144" y="34" class="bit-text">1</text>
    <rect x="159" y="15" width="25" height="28" rx="3" fill="#64748b"/>
    <text x="171" y="34" class="bit-text">0</text>

    <!-- Network (24 bits) -->
    <rect x="200" y="10" width="240" height="38" rx="4" fill="#059669"/>
    <text x="320" y="28" class="bit-text" font-size="10">Network</text>
    <text x="320" y="40" class="bit-text" font-size="8">24 bits</text>

    <!-- Host (8 bits) -->
    <rect x="444" y="10" width="110" height="38" rx="4" fill="#F97316"/>
    <text x="499" y="28" class="bit-text" font-size="10">Host</text>
    <text x="499" y="40" class="bit-text" font-size="8">8 bits</text>

    <text x="620" y="28" class="range-text" font-weight="600">192.0.0.0 –</text>
    <text x="620" y="42" class="range-text">223.255.255.255</text>

    <text x="785" y="35" text-anchor="middle" class="purpose-text" font-size="9">Small networks</text>
  </g>

  <!-- ======= CLASS D ======= -->
  <g transform="translate(0, 340)">
    <rect x="40" y="5" width="50" height="50" rx="25" fill="#7c3aed"/>
    <text x="65" y="36" text-anchor="middle" class="class-label">D</text>

    <!-- Leading bits -->
    <rect x="100" y="15" width="25" height="28" rx="3" fill="#1e293b"/>
    <text x="112" y="34" class="bit-text">1</text>
    <rect x="127" y="15" width="25" height="28" rx="3" fill="#1e293b"/>
    <text x="139" y="34" class="bit-text">1</text>
    <rect x="154" y="15" width="25" height="28" rx="3" fill="#1e293b"/>
    <text x="166" y="34" class="bit-text">1</text>
    <rect x="181" y="15" width="25" height="28" rx="3" fill="#64748b"/>
    <text x="193" y="34" class="bit-text">0</text>

    <!-- Multicast (28 bits) -->
    <rect x="220" y="10" width="334" height="38" rx="4" fill="#7c3aed" opacity="0.8"/>
    <text x="387" y="28" class="bit-text" font-size="10">Multicast Group Address</text>
    <text x="387" y="40" class="bit-text" font-size="8">28 bits</text>

    <text x="620" y="28" class="range-text" font-weight="600">224.0.0.0 –</text>
    <text x="620" y="42" class="range-text">239.255.255.255</text>

    <text x="785" y="35" text-anchor="middle" class="purpose-text" font-size="9">Multicast</text>
  </g>

  <!-- ======= CLASS E ======= -->
  <g transform="translate(0, 420)">
    <rect x="40" y="5" width="50" height="50" rx="25" fill="#64748b"/>
    <text x="65" y="36" text-anchor="middle" class="class-label">E</text>

    <!-- Leading bits -->
    <rect x="100" y="15" width="25" height="28" rx="3" fill="#1e293b"/>
    <text x="112" y="34" class="bit-text">1</text>
    <rect x="127" y="15" width="25" height="28" rx="3" fill="#1e293b"/>
    <text x="139" y="34" class="bit-text">1</text>
    <rect x="154" y="15" width="25" height="28" rx="3" fill="#1e293b"/>
    <text x="166" y="34" class="bit-text">1</text>
    <rect x="181" y="15" width="25" height="28" rx="3" fill="#1e293b"/>
    <text x="193" y="34" class="bit-text">1</text>

    <!-- Reserved -->
    <rect x="220" y="10" width="334" height="38" rx="4" fill="#94a3b8" opacity="0.7"/>
    <text x="387" y="28" class="bit-text" font-size="10">Reserved for Future Use</text>
    <text x="387" y="40" class="bit-text" font-size="8">28 bits</text>

    <text x="620" y="28" class="range-text" font-weight="600">240.0.0.0 –</text>
    <text x="620" y="42" class="range-text">255.255.255.255</text>

    <text x="785" y="35" text-anchor="middle" class="purpose-text" font-size="9">Experimental</text>
  </g>

  <!-- Legend -->
  <g transform="translate(200, 500)">
    <rect x="0" y="0" width="14" height="14" rx="3" fill="#2563EB"/>
    <text x="20" y="12" font-size="11" fill="#334155">Network Portion</text>
    <rect x="150" y="0" width="14" height="14" rx="3" fill="#F97316"/>
    <text x="170" y="12" font-size="11" fill="#334155">Host Portion</text>
    <rect x="290" y="0" width="14" height="14" rx="3" fill="#1e293b"/>
    <text x="310" y="12" font-size="11" fill="#334155">Fixed Leading Bits</text>
  </g>

  <!-- Note -->
  <text x="425" y="540" text-anchor="middle" font-size="10" fill="#94a3b8" font-family="'Segoe UI', Arial, sans-serif">Note: 127.x.x.x is reserved for loopback (localhost) and not used for Class A host addressing</text>
</svg>