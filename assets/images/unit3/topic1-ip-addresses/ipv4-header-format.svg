<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 620">
  <defs>
    <style>
      text { font-family: 'Segoe UI', Arial, sans-serif; }
      .title { font-size: 20px; font-weight: bold; fill: #1e293b; }
      .subtitle { font-size: 12px; fill: #475569; }
      .field-text { font-size: 9.5px; fill: #ffffff; font-weight: 600; text-anchor: middle; }
      .field-sub { font-size: 8px; fill: rgba(255,255,255,0.85); text-anchor: middle; }
      .bit-num { font-size: 9px; fill: #64748b; text-anchor: middle; }
      .row-label { font-size: 10px; fill: #334155; font-weight: 600; }
      .note { font-size: 10px; fill: #64748b; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="850" height="620" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Title -->
  <text x="425" y="35" text-anchor="middle" class="title">IPv4 Packet Header Format</text>
  <text x="425" y="55" text-anchor="middle" class="subtitle">Minimum 20 bytes (without options) — Each row represents 32 bits (4 bytes)</text>

  <!-- Bit position markers -->
  <g transform="translate(105, 75)">
    <!-- Bit numbers across top: 0,4,8,12,16,19,24,31 -->
    <text x="0" y="0" class="bit-num" text-anchor="start">0</text>
    <text x="80" y="0" class="bit-num">4</text>
    <text x="160" y="0" class="bit-num">8</text>
    <text x="280" y="0" class="bit-num">12</text>
    <text x="320" y="0" class="bit-num">16</text>
    <text x="400" y="0" class="bit-num">19</text>
    <text x="520" y="0" class="bit-num">24</text>
    <text x="640" y="0" class="bit-num" text-anchor="end">31</text>
    <!-- tick marks -->
    <line x1="0" y1="5" x2="0" y2="12" stroke="#94a3b8" stroke-width="1"/>
    <line x1="80" y1="5" x2="80" y2="12" stroke="#94a3b8" stroke-width="1"/>
    <line x1="160" y1="5" x2="160" y2="12" stroke="#94a3b8" stroke-width="1"/>
    <line x1="320" y1="5" x2="320" y2="12" stroke="#94a3b8" stroke-width="1"/>
    <line x1="640" y1="5" x2="640" y2="12" stroke="#94a3b8" stroke-width="1"/>
  </g>

  <!-- Row 1: Version | IHL | Type of Service | Total Length -->
  <g transform="translate(105, 90)">
    <!-- Version (4 bits) -->
    <rect x="0" y="0" width="80" height="45" rx="3" fill="#2563EB" stroke="#1d4ed8" stroke-width="1"/>
    <text x="40" y="20" class="field-text">Version</text>
    <text x="40" y="33" class="field-sub">(4 bits)</text>

    <!-- IHL (4 bits) -->
    <rect x="80" y="0" width="80" height="45" rx="3" fill="#3B82F6" stroke="#2563EB" stroke-width="1"/>
    <text x="120" y="20" class="field-text">IHL</text>
    <text x="120" y="33" class="field-sub">(4 bits)</text>

    <!-- Type of Service (8 bits) -->
    <rect x="160" y="0" width="160" height="45" rx="3" fill="#059669" stroke="#047857" stroke-width="1"/>
    <text x="240" y="20" class="field-text">Type of Service</text>
    <text x="240" y="33" class="field-sub">(8 bits)</text>

    <!-- Total Length (16 bits) -->
    <rect x="320" y="0" width="320" height="45" rx="3" fill="#EA580C" stroke="#c2410c" stroke-width="1"/>
    <text x="480" y="20" class="field-text">Total Length</text>
    <text x="480" y="33" class="field-sub">(16 bits)</text>
  </g>

  <!-- Row 2: Identification | Flags | Fragment Offset -->
  <g transform="translate(105, 140)">
    <rect x="0" y="0" width="320" height="45" rx="3" fill="#7c3aed" stroke="#6d28d9" stroke-width="1"/>
    <text x="160" y="20" class="field-text">Identification</text>
    <text x="160" y="33" class="field-sub">(16 bits)</text>

    <rect x="320" y="0" width="60" height="45" rx="3" fill="#db2777" stroke="#be185d" stroke-width="1"/>
    <text x="350" y="20" class="field-text">Flags</text>
    <text x="350" y="33" class="field-sub">(3)</text>

    <rect x="380" y="0" width="260" height="45" rx="3" fill="#0891b2" stroke="#0e7490" stroke-width="1"/>
    <text x="510" y="20" class="field-text">Fragment Offset</text>
    <text x="510" y="33" class="field-sub">(13 bits)</text>
  </g>

  <!-- Row 3: TTL | Protocol | Header Checksum -->
  <g transform="translate(105, 190)">
    <rect x="0" y="0" width="160" height="45" rx="3" fill="#2563EB" stroke="#1d4ed8" stroke-width="1"/>
    <text x="80" y="20" class="field-text">Time to Live (TTL)</text>
    <text x="80" y="33" class="field-sub">(8 bits)</text>

    <rect x="160" y="0" width="160" height="45" rx="3" fill="#059669" stroke="#047857" stroke-width="1"/>
    <text x="240" y="20" class="field-text">Protocol</text>
    <text x="240" y="33" class="field-sub">(8 bits)</text>

    <rect x="320" y="0" width="320" height="45" rx="3" fill="#EA580C" stroke="#c2410c" stroke-width="1"/>
    <text x="480" y="20" class="field-text">Header Checksum</text>
    <text x="480" y="33" class="field-sub">(16 bits)</text>
  </g>

  <!-- Row 4: Source IP Address -->
  <g transform="translate(105, 240)">
    <rect x="0" y="0" width="640" height="50" rx="3" fill="#2563EB" stroke="#1d4ed8" stroke-width="1"/>
    <text x="320" y="22" class="field-text" font-size="12">Source IP Address</text>
    <text x="320" y="38" class="field-sub" font-size="9">(32 bits)</text>
  </g>

  <!-- Row 5: Destination IP Address -->
  <g transform="translate(105, 295)">
    <rect x="0" y="0" width="640" height="50" rx="3" fill="#3B82F6" stroke="#2563EB" stroke-width="1"/>
    <text x="320" y="22" class="field-text" font-size="12">Destination IP Address</text>
    <text x="320" y="38" class="field-sub" font-size="9">(32 bits)</text>
  </g>

  <!-- Row 6: Options + Padding -->
  <g transform="translate(105, 350)">
    <rect x="0" y="0" width="640" height="45" rx="3" fill="#64748b" stroke="#475569" stroke-width="1" stroke-dasharray="6,3"/>
    <text x="320" y="20" class="field-text" font-size="11">Options (variable) + Padding</text>
    <text x="320" y="35" class="field-sub" font-size="9">(0–40 bytes, if IHL > 5)</text>
  </g>

  <!-- Row labels on left -->
  <text x="95" y="118" text-anchor="end" class="row-label">0</text>
  <text x="95" y="168" text-anchor="end" class="row-label">32</text>
  <text x="95" y="218" text-anchor="end" class="row-label">64</text>
  <text x="95" y="270" text-anchor="end" class="row-label">96</text>
  <text x="95" y="325" text-anchor="end" class="row-label">128</text>
  <text x="95" y="378" text-anchor="end" class="row-label">160</text>
  <text x="55" y="395" text-anchor="middle" class="note">Bit</text>
  <text x="55" y="407" text-anchor="middle" class="note">Offset</text>

  <!-- Data section below -->
  <line x1="50" y1="415" x2="800" y2="415" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Legend -->
  <text x="425" y="440" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b" font-family="'Segoe UI', Arial, sans-serif">Key Fields Explained</text>

  <g transform="translate(60, 455)">
    <rect x="0" y="0" width="12" height="12" rx="2" fill="#2563EB"/>
    <text x="18" y="11" font-size="10" fill="#334155" font-family="'Segoe UI', Arial, sans-serif"><tspan font-weight="600">Version:</tspan> IPv4 = 4</text>

    <rect x="0" y="20" width="12" height="12" rx="2" fill="#3B82F6"/>
    <text x="18" y="31" font-size="10" fill="#334155" font-family="'Segoe UI', Arial, sans-serif"><tspan font-weight="600">IHL:</tspan> Header length in 32-bit words (min 5)</text>

    <rect x="0" y="40" width="12" height="12" rx="2" fill="#059669"/>
    <text x="18" y="51" font-size="10" fill="#334155" font-family="'Segoe UI', Arial, sans-serif"><tspan font-weight="600">Protocol:</tspan> TCP=6, UDP=17, ICMP=1</text>

    <rect x="0" y="60" width="12" height="12" rx="2" fill="#EA580C"/>
    <text x="18" y="71" font-size="10" fill="#334155" font-family="'Segoe UI', Arial, sans-serif"><tspan font-weight="600">Total Length:</tspan> Entire packet size in bytes (max 65,535)</text>
  </g>

  <g transform="translate(440, 455)">
    <rect x="0" y="0" width="12" height="12" rx="2" fill="#7c3aed"/>
    <text x="18" y="11" font-size="10" fill="#334155" font-family="'Segoe UI', Arial, sans-serif"><tspan font-weight="600">Identification:</tspan> Fragment reassembly ID</text>

    <rect x="0" y="20" width="12" height="12" rx="2" fill="#db2777"/>
    <text x="18" y="31" font-size="10" fill="#334155" font-family="'Segoe UI', Arial, sans-serif"><tspan font-weight="600">Flags:</tspan> DF (Don't Fragment), MF (More Fragments)</text>

    <rect x="0" y="40" width="12" height="12" rx="2" fill="#0891b2"/>
    <text x="18" y="51" font-size="10" fill="#334155" font-family="'Segoe UI', Arial, sans-serif"><tspan font-weight="600">Fragment Offset:</tspan> Position in original datagram</text>

    <rect x="0" y="60" width="12" height="12" rx="2" fill="#2563EB"/>
    <text x="18" y="71" font-size="10" fill="#334155" font-family="'Segoe UI', Arial, sans-serif"><tspan font-weight="600">TTL:</tspan> Max hops before packet is discarded</text>
  </g>

  <!-- Total header size note -->
  <text x="425" y="555" text-anchor="middle" class="note">Minimum Header Size: 20 bytes (160 bits) • Maximum Header Size: 60 bytes (480 bits with options)</text>

  <!-- Brace showing 20 bytes minimum -->
  <line x1="755" y1="90" x2="755" y2="395" stroke="#2563EB" stroke-width="2"/>
  <line x1="750" y1="90" x2="755" y2="90" stroke="#2563EB" stroke-width="2"/>
  <line x1="750" y1="345" x2="755" y2="345" stroke="#2563EB" stroke-width="2"/>
  <line x1="750" y1="395" x2="755" y2="395" stroke="#2563EB" stroke-width="2"/>
  <text x="770" y="220" text-anchor="start" font-size="9" fill="#2563EB" font-weight="bold" font-family="'Segoe UI', Arial, sans-serif" transform="rotate(90, 770, 220)">20 bytes min</text>

  <!-- Bottom border decoration -->
  <rect x="0" y="600" width="850" height="20" rx="0" fill="#2563EB" opacity="0.05"/>
</svg>