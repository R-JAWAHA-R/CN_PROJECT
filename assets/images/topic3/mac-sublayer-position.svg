<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="networkGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="llcGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="macGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="physGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#D97706" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="shadow1">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
    <filter id="glow">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#10B981" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="500" fill="#FAFBFF" rx="8"/>
  
  <!-- Title -->
  <text x="400" y="38" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#1E293B">MAC Sublayer Position in the Protocol Stack</text>
  <line x1="220" y1="48" x2="580" y2="48" stroke="#10B981" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Left bracket: Data Link Layer -->
  <rect x="105" y="155" width="8" height="190" rx="4" fill="#3B82F6"/>
  <text x="95" y="255" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#2563EB" transform="rotate(-90 95 255)">Data Link Layer</text>
  
  <!-- Network Layer -->
  <rect x="160" y="70" width="340" height="70" rx="14" fill="url(#networkGrad)" filter="url(#shadow1)"/>
  <text x="330" y="105" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="white">Network Layer</text>
  <text x="330" y="125" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="rgba(255,255,255,0.85)">IP Addressing &amp; Routing</text>
  
  <!-- Arrow down -->
  <polygon points="330,145 320,155 340,155" fill="#64748B"/>
  
  <!-- LLC Sublayer -->
  <rect x="160" y="160" width="340" height="70" rx="14" fill="url(#llcGrad)" filter="url(#shadow1)"/>
  <text x="330" y="195" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="white">LLC Sublayer</text>
  <text x="330" y="215" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="rgba(255,255,255,0.85)">Logical Link Control · Flow &amp; Error Control</text>
  
  <!-- Arrow down -->
  <polygon points="330,235 320,245 340,245" fill="#64748B"/>
  
  <!-- MAC Sublayer (highlighted) -->
  <rect x="150" y="250" width="360" height="85" rx="16" fill="url(#macGrad)" filter="url(#glow)" stroke="#059669" stroke-width="2"/>
  <text x="330" y="288" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="800" fill="white">MAC Sublayer</text>
  <text x="330" y="310" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="rgba(255,255,255,0.9)">Medium Access Control · Addressing · Frame Delimiting</text>
  <text x="330" y="325" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="rgba(255,255,255,0.8)">⬤ Closest to the Physical Medium</text>
  
  <!-- Arrow down -->
  <polygon points="330,340 320,350 340,350" fill="#64748B"/>
  
  <!-- Physical Layer -->
  <rect x="160" y="355" width="340" height="70" rx="14" fill="url(#physGrad)" filter="url(#shadow1)"/>
  <text x="330" y="390" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="white">Physical Layer</text>
  <text x="330" y="410" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="rgba(255,255,255,0.85)">Bits on the Wire / Wireless Medium</text>
  
  <!-- Shared Medium at bottom -->
  <line x1="130" y1="450" x2="530" y2="450" stroke="#D97706" stroke-width="4" stroke-linecap="round" stroke-dasharray="8,4"/>
  <text x="330" y="468" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#92400E">Shared Transmission Medium (Bus / Wireless)</text>
  
  <!-- Right side callout -->
  <rect x="540" y="252" width="240" height="80" rx="12" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>
  <line x1="500" y1="292" x2="540" y2="292" stroke="#10B981" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="660" y="278" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#065F46">Controls WHO can</text>
  <text x="660" y="296" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#065F46">transmit WHEN on</text>
  <text x="660" y="314" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#065F46">shared media</text>
  
  <!-- Right side note for DLL -->
  <rect x="540" y="168" width="210" height="48" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1"/>
  <line x1="500" y1="192" x2="540" y2="192" stroke="#3B82F6" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="645" y="189" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#1E40AF">Data Link Layer = LLC + MAC</text>
  <text x="645" y="204" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#3B82F6">Two sublayers working together</text>

  <!-- Star icon near MAC -->
  <text x="165" y="285" font-size="22">⭐</text>
  
  <!-- Bottom annotation -->
  <rect x="180" y="478" width="300" height="18" rx="9" fill="#10B981" opacity="0.12"/>
  <text x="330" y="491" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" fill="#065F46">MAC = Interface between LLC (software) and Physical (hardware)</text>
</svg>